<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<title>vibebook</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(0.975 0.008 240); --panel: oklch(1 0 0); --line: oklch(0.91 0.01 245); --ink: oklch(0.2 0.02 250); --mute: oklch(0.45 0.02 250);
    --accent: oklch(0.5 0.17 248); --accent-ink: #fff; --ai: oklch(0.5 0.17 248); --ai-bg: oklch(0.95 0.03 245); --ok: oklch(0.6 0.14 155); --sun: oklch(0.9 0.16 98);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); color-scheme: light;
    font: 16px/1.55 "Schibsted Grotesk", system-ui, sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 12px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.ghost { border-color: transparent; background: transparent; }
  input, textarea { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 10px; outline: none; }
  input:focus, textarea:focus { border-color: var(--ink); }
  h1, h2, .brand { font-family: Caprasimo, Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  .muted { color: var(--mute); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700;
    color: #fff; flex: none; position: relative; }
  .avatar.on::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); border: 2px solid var(--panel); }
  .avatar.ai { background: var(--ai); }

  /* home */
  .home { max-width: 1120px; margin: 0 auto; padding: 22px 24px 80px; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; flex-wrap: wrap; }
  .top .brand { font-size: 26px; margin: 0; flex: 1; }
  .top .brand a { color: var(--accent); text-decoration: none; }
  .me { display: inline-flex; align-items: center; gap: 8px; border: none; background: transparent; padding: 4px 10px 4px 4px; border-radius: 999px; max-width: 60vw; }
  .me:hover { background: var(--panel); }
  @media (max-width: 520px) { .hello .primary { width: 100%; } .me span { max-width: 120px; } }
  .me span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .hello { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 36px; }
  .ask { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px; margin: 4px 0 32px; box-shadow: 0 18px 40px -28px oklch(0.25 0.08 250 / .5); }
  .ask label { display: block; font: 400 22px/1.1 Caprasimo, serif; margin-bottom: 10px; }
  .askRow { display: flex; gap: 10px; align-items: flex-end; }
  .askRow textarea { flex: 1; min-width: 0; resize: none; min-height: 52px; max-height: 200px; font-size: 16px; }
  .askOut { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); display: grid; gap: 10px; }
  .askOut .where { font-size: 16px; } .askOut .where b { font-weight: 700; }
  .askOut .why { color: var(--mute); font-size: 14px; }
  .askOut .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .askOut .acts .ghost { font-size: 14px; }
  .askOut .acts .primary.vibe { background: #14305e; color: #f2dc4a; }
  .askOut .alts { border-top: 1px solid var(--line); padding-top: 10px; }
  @media (max-width: 720px) {
    .ask { margin: 0 -4px 24px; padding: 14px; border-radius: 18px; }
    .ask label { font-size: 20px; }
    .askRow { flex-direction: column; align-items: stretch; }
    .askRow textarea { min-height: 120px; }
    .askRow .primary { padding: 14px; font-size: 16px; }
  }
  .hello h1 { font-size: clamp(2rem, 4.2vw, 3rem); margin: 0; line-height: 1.05; }
  .helloText { flex: 1 1 320px; min-width: 0; }
  .hello p { margin: 10px 0 0; color: var(--mute); }
  .hello .primary { padding: 12px 18px; border-radius: 999px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 48px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; gap: 40px; } }
  .folder + .folder { margin-top: 40px; }
  .folder h2 { font-size: 22px; margin: 0 0 16px; display: flex; align-items: baseline; gap: 8px; }
  .folder h2 small { font: 600 13px "Schibsted Grotesk", sans-serif; color: var(--mute); }
  .cards { display: grid; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; text-decoration: none; color: inherit;
    display: flex; min-height: 112px; transition: transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s cubic-bezier(.22,1,.36,1); }
  .card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px -18px oklch(0.25 0.08 250 / .45); }
  .card { position: relative; }
  .card .arch { position: absolute; top: 10px; right: 10px; opacity: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 5px 8px; font-size: 14px; line-height: 1; cursor: pointer; }
  .card:hover .arch, .card .arch:focus-visible { opacity: 1; }
  .card .arch:hover { border-color: #c2410c; }
  @media (hover: none) { .card .arch { opacity: .7; } }
  .archLink { font-size: 14px; color: var(--mute); }
  .archLink:hover { color: var(--ink); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .cover { flex: 0 0 120px; position: relative; display: flex; align-items: flex-end; padding: 14px 14px 14px 22px; color: #fff;
    background-image: radial-gradient(circle at 88% 12%, oklch(1 0 0 / .22), transparent 48%); box-shadow: inset 7px 0 0 oklch(0 0 0 / .14); }
  .cover span { font: 400 34px/1 Caprasimo, serif; letter-spacing: .02em; }
  @media (max-width: 560px) { .cover { flex-basis: 84px; padding-left: 18px; } .cover span { font-size: 26px; } }
  .card .info { padding: 16px 20px; min-width: 0; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card b { font-size: 18px; line-height: 1.3; }
  .card .sum { font-size: 14px; color: var(--mute); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 8px; font-size: 13px; color: var(--mute); }
  .stack { display: flex; padding-left: 4px; }
  .stack .avatar { width: 26px; height: 26px; font-size: 11px; margin-left: -6px; box-shadow: 0 0 0 2px var(--panel); }
  .friends { position: sticky; top: 24px; }
  .friends h2 { margin: 0 0 14px; font-size: 22px; display: flex; align-items: baseline; gap: 8px; }
  .friends h2 small { font: 600 13px "Schibsted Grotesk", sans-serif; color: var(--mute); }
  .friend { display: flex; align-items: center; gap: 12px; padding: 8px 10px; margin: 0 -10px; border-radius: 12px; }
  .friend:hover { background: var(--panel); }
  .friend .fn { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .friend small { display: block; color: var(--mute); font-size: 13px; font-weight: 400; }
  .friend .x { opacity: 0; }
  .friend:hover .x, .friend .x:focus-visible { opacity: 1; }
  @media (hover: none) { .friend .x { opacity: .6; } }
  .invite { margin-top: 14px; display: flex; gap: 8px; }
  .agentBox { background: var(--panel); border-radius: 16px; padding: 16px; margin-bottom: 26px; }
  .agentBox h2 { margin: 0 0 6px; font-size: 20px; }
  .agentBox p { margin: 0 0 10px; font-size: 14px; color: var(--mute); }
  .agentBox .how { font-size: 13px; font-weight: 700; margin: 12px 0 6px; }
  .agentBox code { display: block; font: 12px/1.5 ui-monospace, Menlo, monospace; background: var(--bg, #fff); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; overflow-wrap: anywhere; cursor: copy; }
  .agentBox .wait { font-size: 13px; color: var(--mute); margin-top: 12px; display: flex; gap: 8px; align-items: center; }
  .agentBox .wait::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #e3b505; animation: agentBlink 1.4s infinite; }
  @keyframes agentBlink { 50% { opacity: .3; } }
  .agentBox .conn { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
  .agentBox .conn b { flex: 1; min-width: 0; } .agentBox .conn small { display: block; color: var(--mute); font-weight: 400; }
  .agentBox .ok { color: #1f9d8a; font-weight: 700; }
  .agentNudge { margin: 12px 28px 0; padding: 12px 16px; border-radius: 14px; background: var(--ai-bg); display: flex; gap: 12px; align-items: center; font-size: 14px; }
  .agentNudge[hidden] { display: none; }
  .agentNudge div { flex: 1; min-width: 0; } .agentNudge b { display: block; font-size: 15px; }
  .agentNudge a.primary { text-decoration: none; padding: 8px 14px; border-radius: 999px; white-space: nowrap; font-weight: 700; background: var(--accent); color: #fff; }
  .bell { position: relative; padding: 6px 8px; line-height: 0; }
  .bell svg { width: 20px; height: 20px; }
  .bell.default::after { content: ""; position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: #e3b505; }
  .bell.denied { color: #c2410c; }
  .bell.muted { opacity: .55; }
  .agentTag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: #f2dc4a; color: #14305e; margin-left: 4px; }
  .msg.agent .avatar { border-radius: 9px; }
  .invite input { flex: 1; min-width: 0; }
  .row { display: flex; gap: 8px; }
  .row input, .row textarea { flex: 1; min-width: 0; }
  .nameAsk { display: grid; gap: 6px; background: var(--ai-bg); border-radius: 16px; padding: 18px 20px; margin-bottom: 28px; max-width: 520px; }
  .nameAsk .row { margin-top: 6px; }
  .empty { border: 1px dashed var(--line); border-radius: 14px; padding: 28px; text-align: center; color: var(--mute); }

  /* book */
  .book { display: grid; grid-template-columns: var(--side-w, 272px) minmax(0, 1fr) var(--doc-w, 380px); height: 100dvh; }
  .book.rail { --side-w: 68px; }
  .book > * { min-height: 0; }
  .book { overflow: hidden; }
  .book.nodoc { grid-template-columns: var(--side-w, 272px) 1fr; }
  .book.nodoc .doc { display: none; }
  .side { border-right: 1px solid var(--line); padding: 20px 16px; overflow: auto; display: flex; flex-direction: column; gap: 24px; background: var(--bg); }
  .side .title { font-family: Caprasimo, serif; font-size: 20px; border: none; background: transparent; padding: 2px 0; width: 100%; }
  .side .folderTag { font-size: 12px; color: var(--mute); }
  .sec h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); }
  .thread { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: none; background: transparent; padding: 9px 10px; border-radius: 10px; }
  .thread.sel { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
  .thread .n { margin-left: auto; font-size: 12px; color: var(--mute); flex: none; font-variant-numeric: tabular-nums; }
  .sec .thread + .thread, .sec .thread + .newRoom { margin-top: 2px; }
  /* Rows keep their hover/selected padding but their content lines up with the sidebar edge. */
  .side .sec .thread, .side .newRoom, .side .friendAdd { margin-left: -10px; margin-right: -10px; width: calc(100% + 20px); }
  .ri.book, .rb.geral { background: var(--accent); color: #fff; box-shadow: none; }
  .folderChip { font: 500 12px "Schibsted Grotesk", sans-serif; color: var(--mute); background: var(--bg); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  #roomName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ri { width: 26px; height: 26px; border-radius: 8px; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); }
  .rt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .newRoom { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; }
  .newRoom .ri { background: transparent; color: var(--mute); font-size: 16px; font-weight: 400; box-shadow: inset 0 0 0 1.5px var(--line); }
  .newRoom input { flex: 1; min-width: 0; border: none; background: transparent; padding: 4px 0; }
  .newRoom:focus-within { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
  .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 0 8px 4px; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .arch summary { font-size: 12px; color: var(--mute); cursor: pointer; padding: 6px 4px; list-style: none; }
  .arch summary::before { content: "▸ "; } .arch[open] summary::before { content: "▾ "; }
  .thread.archived { opacity: .6; }
  .thread.pre { background: none; border: 1.5px dashed var(--line); color: var(--mute); }
  .thread.pre .ri { background: none; border: 1.5px dashed currentColor; color: var(--mute); }
  .thread.pre:hover, .thread.pre.sel { border-color: var(--accent); color: var(--ink); }
  .book.pre .composer, .book.pre .tasks, .book.pre .agentNudge { display: none; }
  .preCard { max-width: 560px; margin: 32px auto; border: 1.5px dashed var(--accent); border-radius: 16px; padding: 24px 26px; }
  .preCard .kicker { margin: 0 0 6px; font-size: 12px; font-weight: 700; color: var(--accent); }
  .preCard h3 { margin: 0 0 10px; font-size: 22px; }
  .preCard h4 { margin: 18px 0 6px; font-size: 13px; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; }
  .preCard ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
  .preCard .row { margin-top: 20px; gap: 8px; }
  .sug { background: var(--ai-bg); border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-bottom: 6px; }
  .sug b { display: block; }
  .sug .row { margin-top: 6px; }
  .sug button { padding: 3px 8px; font-size: 12px; }
  .friendAdd { display: flex; align-items: center; gap: 8px; border: none; background: transparent; padding: 4px 10px; margin-top: 2px; font-size: 13px; text-align: left; border-radius: 10px; color: var(--mute); }
  .friendAdd:hover { background: var(--panel); color: var(--ink); }
  .friendAdd .fn { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .friendAdd b { color: var(--accent); font-size: 16px; }
  .member .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .x { font-size: 18px; line-height: 1; padding: 2px 7px; color: var(--mute); flex: none; }
  .x:hover { color: oklch(0.5 0.2 25); background: oklch(0.95 0.03 25); }
  .friend .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .resend { font-size: 12px; padding: 2px 6px; color: var(--accent); flex: none; }
  .member { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; overflow: hidden; text-overflow: ellipsis; }

  .chat { display: flex; flex-direction: column; min-width: 0; background: var(--panel); }
  .chathead, .doc header { height: 64px; flex: none; padding: 0 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .chathead h2 { margin: 0; font-size: 18px; flex: 1; }
  .tasks { padding: 14px 28px; border-bottom: 1px solid var(--line); background: var(--bg); max-height: 40%; overflow: auto; }
  .task { display: flex; gap: 10px; align-items: center; padding: 3px 0; }
  .task .tt { flex: 1; cursor: text; border-radius: 6px; padding: 2px 4px; margin: -2px -4px; }
  .task .tt:hover { background: var(--panel); }
  .task .x { opacity: 0; }
  .task:hover .x, .task .x:focus-visible { opacity: 1; }
  .tedit { flex: 1; padding: 3px 6px; }
  .epicName { cursor: text; border-radius: 6px; }
  .epicName:hover { background: var(--bg); }
  #threadTitle { display: flex; align-items: center; gap: 6px; min-width: 0; }
  #threadTitle .x { font-size: 14px; opacity: .5; }
  #threadTitle .x:hover { opacity: 1; }
  .task.done span { text-decoration: line-through; color: var(--mute); }
  .msgs { flex: 1; overflow: auto; padding: 28px 28px 20px; display: flex; flex-direction: column; gap: 24px; }
  .kanban { display: none; }
  .book.boardview .tasks, .book.boardview .msgs, .book.boardview .composer, .book.boardview .agentNudge { display: none; }
  .book.boardview .kanban { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 16px 20px 20px; gap: 12px; }
  #toggleBoard[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
  .lanes { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(170px, 1fr)); gap: 10px; overflow-x: auto; }
  .lane { min-width: 0; background: color-mix(in oklch, var(--line) 45%, var(--bg)); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; border: 2px solid transparent; }
  .lane.over { border-color: var(--accent); }
  .lane > h3 { margin: 0; padding: 12px 14px 8px; font: 700 13px/1 "Schibsted Grotesk", sans-serif; display: flex; justify-content: space-between; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; }
  .lane .cards { flex: 0 1 auto; overflow: auto; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; }
  .kcard { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: grab; display: grid; gap: 6px; font-size: 14px; }
  .kcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .kcard.dragging { opacity: .5; }
  .kcard .kt { font-weight: 600; line-height: 1.35; }
  .kcard.done .kt { text-decoration: line-through; color: var(--mute); }
  .kcard .km { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--mute); }
  .kcard .kep { color: #fff; border-radius: 6px; padding: 1px 6px; font-weight: 700; font-size: 11px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kcard .avatar { width: 20px; height: 20px; font-size: 9px; }
  .kadd { display: flex; gap: 6px; padding: 0 10px 10px; flex-wrap: wrap; }
  .kadd input { flex: 1 1 120px; min-width: 0; } .kadd select { flex: 1 1 100%; min-width: 0; width: 100%; font: 13px "Schibsted Grotesk", sans-serif; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--bg); color: var(--ink); }
  .kempty { color: var(--mute); font-size: 13px; padding: 4px 4px 10px; }
  @media (max-width: 900px) { .lanes { grid-template-columns: repeat(4, 78vw); scroll-snap-type: x mandatory; } .lane { scroll-snap-align: start; } }
  .msg { display: flex; gap: 14px; max-width: 760px; position: relative; margin: 0 -10px; padding: 6px 10px; border-radius: 12px; }
  .msg:hover { background: color-mix(in oklch, var(--line) 30%, transparent); }
  .msg .hhmm { font-size: 12px; color: var(--mute); opacity: 0; margin-left: 6px; }
  .msg:hover .hhmm { opacity: 1; }
  .rcpt { font-size: 12px; color: var(--mute); margin-top: 4px; }
  .msg.cont { margin-top: -20px; }
  .msg.cont > .avatar { visibility: hidden; }
  .msg.cont .who { display: none; }
  .msg.cont .gut { position: absolute; left: 10px; top: 9px; width: 34px; text-align: center; font-size: 11px; color: var(--mute); opacity: 0; }
  .msg.cont:hover .gut { opacity: 1; }
  .msg .body { min-width: 0; }
  .msg .who { font-size: 13px; color: var(--mute); margin-bottom: 3px; }
  .msg .txt { white-space: pre-wrap; word-wrap: break-word; }
  .msg.ai .txt { background: var(--ai-bg); padding: 14px 18px; border-radius: 4px 16px 16px 16px; white-space: normal; }
  .msg.ai .txt p { margin: 0 0 10px; } .msg.ai .txt p:last-child { margin: 0; }
  .msg.ai .txt ul { margin: 6px 0 10px; padding-left: 20px; } .msg.ai .txt li + li { margin-top: 4px; }
  .typing { color: var(--ai); font-size: 13px; overflow-wrap: anywhere; }
  .msg .txt a { color: var(--accent); overflow-wrap: anywhere; }
  .composer { border-top: 1px solid var(--line); padding: 12px 24px 14px; display: flex; flex-direction: column; gap: 6px; position: relative; }
  .mention { background: oklch(0.92 0.06 245); color: #14305e; border-radius: 5px; padding: 0 4px; font-weight: 600; }
  .mention.me { background: var(--sun, #f2dc4a); color: #14305e; }
  .mentionPop { position: absolute; left: 24px; bottom: calc(100% - 8px); min-width: 240px; max-width: calc(100% - 48px); background: var(--bg, #fff); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 40px -20px rgb(10 30 70 / .35); padding: 6px; z-index: 5; }
  .mentionPop[hidden] { display: none; }

<body>
<nav id="switcher" aria-label="Seus vibebooks"></nav>
<div id="swTip" role="tooltip" hidden></div>
<dialog id="swDlg" class="swDlg" aria-label="Ir para um vibebook"><input id="swQ" placeholder="Ir para um vibebook…" autocomplete="off" /><div id="swList" role="listbox"></div></dialog>
<div id="app"></div>
<script>
const $app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const COLORS = ["#ff5a36", "#1f9d8a", "#3b6cf6", "#c2410c", "#9333ea", "#0f766e", "#be185d", "#4d7c0f"];
const color = (s) => COLORS[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
let knownNames = {}; // email → display name (from /api/me friends + book state)
const name = (email) => email === "ai" ? "@vibe" : S?.names?.[email] || knownNames[email] || email.split("@")[0];
const avatar = (email, on) => email === "ai"
  ? `<span class="avatar ai">✦</span>`
  : `<span class="avatar ${on ? "on" : ""}" style="background:${color(email)}" title="${esc(name(email))}">${esc(name(email).slice(0, 2).toUpperCase())}</span>`;
const ago = (ts) => { const m = Math.round((Date.now() - ts) / 60000); return m < 1 ? "agora" : m < 60 ? `${m} min` : m < 1440 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d`; };
// Escaped text → clickable http(s) links (opened safely in a new tab).
// @mentions: a member's handle is their first name (accents stripped), else the first part of their email.
const fold = (x) => x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9._-]/g, "");
// Accepted handles: first name, the email's local part, and its first token ("leca" for leca.schatz@).
const handlesOf = (email) => { const local = email.split("@")[0]; return [fold(S?.names?.[email]?.split(/\s+/)[0] || knownNames[email]?.split(/\s+/)[0] || ""), fold(local.split(/[._+-]/)[0]), fold(local)].filter(Boolean); };
const handleOf = (email) => handlesOf(email)[0];
const mentionTarget = (h) => {
  const k = fold(h);
  if (k === "vibe" || k === "ai") return "ai";
  return (S?.members || []).find((e) => handlesOf(e).includes(k)) || null;
};
const mentions = (h) => h.replace(/(^|[\s(>])@([\p{L}\p{N}._-]+)/gu, (all, pre, tag) => {
  const who = mentionTarget(tag);
  return who ? `${pre}<span class="mention${who === S?.me ? " me" : ""}" title="${esc(who === "ai" ? "@vibe" : who)}">@${tag}</span>` : all;
});
const linkify = (h) => h.replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)"'\]]/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer nofollow ugc">${u}</a>`);
// Tiny markdown for AI messages: escape first, then bold/italics/lists/paragraphs.
const md = (s) => linkify(esc(s))
  .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\W)_(.+?)_(\W|$)/g, "$1<i>$2</i>$3")
  .split(/\n{2,}/).map((p) => /^\s*[-*] /m.test(p)
    ? `<ul>${p.split("\n").map((l) => l.replace(/^\s*[-*] /, "")).filter(Boolean).map((l) => `<li>${l}</li>`).join("")}</ul>`
    : `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
const api = async (path, body) => {
  const r = await fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { location.href = `/login?next=${encodeURIComponent(location.pathname)}`; throw new Error("unauthenticated"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
};

}

// Home composer: suggest the room/epic, then post there on one click and open it.
function wireAsk() {
  const form = document.getElementById("ask"), ta = document.getElementById("askText"), out = document.getElementById("askOut"), btn = document.getElementById("askBtn");
  if (!form) return;
  ta.oninput = () => { ta.style.height = "auto"; ta.style.height = `${ta.scrollHeight}px`; };
  ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } };
  const where = (p) => `<b>${esc(p.book_title)}</b>${p.epic_title ? ` → <b>${esc(p.epic_title)}</b>` : ""}`;
  // Destination first (picked, alternative or a new room), then how: as a chat message, or as a request to @vibe.
  const go = async (dest, toVibe) => {
    const raw = ta.value.trim();
    const text = toVibe && !/(^|\s)@(vibe|ai)\b/i.test(raw) ? `@vibe ${raw}` : raw;
    out.innerHTML = `<div class="why">Enviando…</div>`;
    try {
      const bookId = dest.book_id ?? (await api("/api/books", { title: dest.new_title })).id;
      await api(`/api/books/${bookId}/post`, { text, thread: dest.epic_id || "main" });
      pendingThread = dest.epic_id || null;
      history.pushState(null, "", `/b/${bookId}`); route();
    } catch (err) { out.innerHTML = `<div class="why bad">${esc(err.message)}</div>`; }
  };
  form.onsubmit = async (e) => {
    e.preventDefault();
    const text = ta.value.trim(); if (!text) return;
    btn.disabled = true; out.hidden = false; out.innerHTML = `<div class="why">Procurando a sala certa…</div>`;
    let r;
    try { r = await api("/api/route", { text }); } catch (err) { out.innerHTML = `<div class="why">${esc(err.message)}</div>`; btn.disabled = false; return; }
    btn.disabled = false;
    const short = (t) => (t.length > 40 ? `${t.slice(0, 38)}…` : t);
    const dests = [...[r.pick, ...r.alternatives].filter(Boolean), { book_id: null, epic_id: null, new_title: r.new_room_title }];
    let sel = 0;
    const label = (d) => (d.book_id ? where(d) : `sala nova <b>“${esc(short(d.new_title))}”</b>`);
    const render = () => {
      const d = dests[sel];
      out.innerHTML = `<div class="where">${d.book_id ? `Mandar em ${label(d)}?` : r.pick ? `Criar ${label(d)}?` : `Nenhuma sala parece a certa. Criar ${label(d)}?`}</div>
        ${sel === 0 && r.pick && r.reason ? `<div class="why">${esc(r.reason)}</div>` : ""}
        <div class="acts">
          <button type="button" class="primary" data-send="chat">Enviar no chat</button>
          <button type="button" class="primary vibe" data-send="vibe" title="Posta com @vibe: ele responde e já organiza (tarefas, doc, decisões)">✦ Pedir pro @vibe</button>
          <button type="button" class="ghost" data-cancel>Cancelar</button>
        </div>
        ${dests.length > 1 ? `<div class="acts alts"><span class="why">Outro lugar:</span>${dests.map((x, i) => (i === sel ? "" : `<button type="button" class="ghost" data-sel="${i}">${label(x)}</button>`)).join("")}</div>` : ""}`;
      out.querySelectorAll("[data-send]").forEach((b) => b.onclick = () => go(dests[sel], b.dataset.send === "vibe"));

function onEvent(ev, id) {
  switch (ev.t) {
    case "state": {
      const firstLoad = !S;
      S = { ...ev, id, typing: {} };
      if (S.messages.length) seenHere(S.messages.at(-1).id);
      if (firstLoad) renderBook(); else { renderSide(); renderChat(); renderDoc(true); }
      return;
    }
    case "msg": seenHere(ev.m.id); S.messages.push(ev.m); if (ev.m.thread === thread) appendMsg(ev.m); renderSide(); notifyMsg(ev.m); return;
    case "delta": {
      const m = S.messages.find((x) => x.id === ev.id); if (m) m.text = ev.text;
      delete S.typing[ev.id];
      const el = document.getElementById(`m${ev.id}`); if (el) { const t = el.querySelector(".txt"); t.hidden = false; t.innerHTML = mentions(md(ev.text)); }
      scrollDown(); return;
    }
    case "typing": { S.typing[ev.id] = ev.mode; const m = S.messages.find((x) => x.id === ev.id); const el = document.getElementById(`m${ev.id}`); if (el && !m?.text) el.querySelector(".txt").innerHTML = `<span class="typing">${ev.note ? esc(ev.note) : `pensando (${modeLabel[ev.mode]})`}…</span>`; return; }
    case "epics": S.epics = ev.epics;
      if (pendingEpic) { const made = S.epics.findLast((e) => e.title === pendingEpic); if (made) { thread = made.id; boardEpic = made.id; pendingEpic = null; renderChat(); } }
      if (thread !== "main" && !isPre() && !S.epics.some((e) => e.id === thread)) thread = "main"; renderSide(); renderTasks(); renderKanban(); return;
    case "doc": S.doc = ev.text; renderDoc(); return;
    case "meta":
      if (ev.title) { S.book.title = ev.title; const mine = myBooks?.find((b) => b.id === id); if (mine) { mine.title = ev.title; renderSwitcher(); } }
      if (ev.folder) S.book.folder = ev.folder;
      if (ev.summary) S.book.summary = ev.summary;
      renderSide(); renderTasks(); return;
    case "suggestions": {
      const was = preOf()?.title; S.suggestions = ev.suggestions;
      if (skipFrom !== null) { const n = S.suggestions.length; thread = n ? `pre:${Math.min(skipFrom, n - 1)}` : "main"; skipFrom = null; renderChat(); }
      else if (isPre() && preOf()?.title !== was) { const j = S.suggestions.findIndex((x) => x.title === was); thread = j >= 0 ? `pre:${j}` : "main"; renderChat(); }
      renderSide(); return;
    }
    case "members": S.members = ev.members; S.pending = ev.pending; S.names = ev.names || S.names; renderSide(); return;
    case "files": S.files = ev.files; renderFiles(); return;
    case "decisions": S.decisions = ev.decisions; renderDecisions(); return;
    case "receipts": S.receipts = ev.receipts; renderReceipts(); return;
    case "poll":
      S.polls = { ...S.polls, [ev.poll.id]: ev.poll };
      document.querySelectorAll(`.poll[data-poll="${ev.poll.id}"]`).forEach((el) => { el.outerHTML = pollHtml(ev.poll.id); });
      return;
    case "online": S.online = ev.online; renderSide(); return;
    case "blocked": {
      const input = document.getElementById("input");
      if (input && !input.value) input.value = ev.text;
      alert(`Não enviei: parece ${ev.reason}. Segredo não entra na sala, nem pra você nem pros agents. Manda por um canal seguro.`);
      return;
    }
  }
}

// 🔔 Browser notifications + a chime when a message arrives while this tab is in the background
// (or in another thread). Needs the app open in a tab; push with the tab closed would need Web Push.
// ponytail: tab-open only; add a service worker + VAPID push when people ask for closed-tab alerts.
const BELL = {
  on: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
  off: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/></svg>',
};
const notifyPerm = () => ("Notification" in window ? Notification.permission : "unsupported");
const notifyMuted = () => { try { return localStorage.getItem("vb.mute") === "1"; } catch { return false; } };
function renderBells() {
  const p = notifyPerm(), muted = notifyMuted();
  const state = p === "granted" ? (muted ? "muted" : "on") : p;
  const title = { on: "Notificações ligadas: clique pra silenciar", muted: "Notificações silenciadas: clique pra ligar", default: "Ativar notificações de mensagem", denied: "Notificações bloqueadas no navegador", unsupported: "Este navegador não tem notificações" }[state];
  document.querySelectorAll("[data-bell]").forEach((b) => {
    b.className = `ghost bell ${state}`;
    b.innerHTML = state === "on" ? BELL.on : BELL.off;
    b.title = title; b.setAttribute("aria-label", title);
    b.onclick = async () => {
      unlockChime();
      if (state === "default") { await Notification.requestPermission(); if (notifyPerm() === "granted") { try { localStorage.removeItem("vb.mute"); } catch {} chime(); } }
      else if (state === "denied") alert("As notificações estão bloqueadas pra vibebook.dev neste navegador. Clique no cadeado ao lado do endereço → Notificações → Permitir, e recarregue a página.");
      else if (state === "on" || state === "muted") { try { localStorage.setItem("vb.mute", state === "on" ? "1" : ""); } catch {} if (state === "muted") chime(); }
      renderBells();
    };
  });
}
let audioCtx = null;
const unlockChime = () => { try { audioCtx ??= new AudioContext(); audioCtx.resume(); } catch {} };
document.addEventListener("pointerdown", unlockChime, { once: true });
function chime() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  [[880, 0], [1318.5, 0.12]].forEach(([f, d]) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t0 + d); g.gain.linearRampToValueAtTime(0.18, t0 + d + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t0 + d + 0.5);
    o.connect(g).connect(audioCtx.destination); o.start(t0 + d); o.stop(t0 + d + 0.55);
  });
}
function notifyMsg(m) {
  if (m.author === S.me || notifyMuted()) return;
  const mentioned = m.text && [...m.text.matchAll(/(?:^|[\s(])@([\p{L}\p{N}._-]+)/gu)].some((x) => mentionTarget(x[1]) === S.me);
  const away = document.hidden || m.thread !== thread;
  if (!away && !mentioned) return;
  chime();
  if (notifyPerm() === "granted" && document.hidden) {
    const who = m.author === "ai" ? "@vibe" : m.kind === "agent" ? `${m.via || "agent"} de ${name(m.author)}` : name(m.author);
    const n = new Notification(`${mentioned ? "Te mencionaram · " : ""}${who} · ${S.book?.title ?? "vibebook"}`, { body: (m.text || (m.author === "ai" ? "respondendo…" : "📎 anexo")).slice(0, 180), tag: `vb-${S.id}`, icon: "/apple-touch-icon.png" });
    n.onclick = () => { window.focus(); n.close(); };
  }
}

    pop.innerHTML = picks.map((p, i) => `<button type="button" role="option" class="${i === pickAt ? "sel" : ""}" data-i="${i}">${avatar(p.email)}<b>@${esc(p.handle)}</b><small>${esc(p.label)}</small></button>`).join("");
    pop.hidden = !picks.length;
  };
  pop.onmousedown = (e) => { const b = e.target.closest("[data-i]"); if (b) { e.preventDefault(); choose(Number(b.dataset.i)); } };
  const updatePop = () => {
    const before = input.value.slice(0, input.selectionStart);
    const m = before.match(/(^|\s)@([\p{L}\p{N}._-]*)$/u);
    if (!m) return closePop();
    atStart = before.length - m[2].length - 1;
    const q = fold(m[2]);
    const people = [{ email: "ai", handle: "vibe", label: "organiza a sala" }, ...(S.members || []).filter((e) => e !== S.me).map((e) => ({ email: e, handle: handleOf(e), label: name(e) === handleOf(e) ? e : name(e) }))];
    picks = people.filter((p) => !q || p.handle.startsWith(q) || fold(p.label).includes(q)).slice(0, 8);
    pickAt = 0; renderPop();
  };
  input.oninput = () => {
    input.style.height = "auto"; input.style.height = `${input.scrollHeight}px`;
    updatePop();
  };
  input.onblur = () => setTimeout(closePop, 100);
  input.onkeydown = (e) => {
    if (!pop.hidden && picks.length) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); pickAt = (pickAt + (e.key === "ArrowDown" ? 1 : picks.length - 1)) % picks.length; return renderPop(); }
      if ((e.key === "Enter" || e.key === "Tab") && !e.isComposing) { e.preventDefault(); return choose(pickAt); }
      if (e.key === "Escape") { e.preventDefault(); return closePop(); }
    }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); document.getElementById("composer").requestSubmit(); }
  };
  // Attachments: paste, drop or 📎. Upload right away; send once all are done.
  const tray = document.getElementById("tray");
  const sendBtn = document.getElementById("sendBtn");
  const renderTray = () => {
    tray.innerHTML = attached.map((p, i) => `<div class="pend ${!p.meta && !p.error ? "up" : ""} ${p.error ? "err" : ""}" title="${esc(p.error || p.file.name)}">
      ${p.url ? `<img src="${p.url}" alt="">` : `📄<br>${esc(p.file.name.slice(0, 18))}`}${p.error ? `<span style="position:relative;z-index:1">${esc(p.error)}</span>` : ""}
      <button type="button" class="rm" data-rm="${i}" aria-label="Remover anexo">×</button></div>`).join("");
    tray.querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => { const [p] = attached.splice(Number(b.dataset.rm), 1); if (p?.url) URL.revokeObjectURL(p.url); renderTray(); });
    const uploading = attached.some((p) => !p.meta && !p.error);
    sendBtn.disabled = uploading; sendBtn.textContent = uploading ? "Enviando…" : "Enviar";
  };
  const addFiles = (list) => {
    for (let file of list) {
      if (!file.type && /\.html?$/i.test(file.name)) file = new File([file], file.name, { type: "text/html" });
      if (!FILE_TYPES.includes(file.type)) { alert(`${file.name}: só imagens (png, jpg, webp, gif), PDF e HTML.`); continue; }
      if (file.size > 10 * 1024 * 1024) { alert(`${file.name}: maior que 10MB.`); continue; }
      if (!file.name || file.name === "image.png") file = new File([file], `print-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.png`, { type: file.type });
      const p = { file, url: file.type.startsWith("image/") ? URL.createObjectURL(file) : null };
      attached.push(p);
      fetch(`/api/books/${S.id}/files`, { method: "POST", headers: { "content-type": file.type, "x-filename": encodeURIComponent(file.name) }, body: file })
        .then(async (r) => { const j = await r.json().catch(() => ({})); if (r.ok) p.meta = j; else p.error = j.error || "falhou"; })
        .catch(() => { p.error = "sem conexão"; })
        .finally(renderTray);
    }
    renderTray();
  };
  const fileInput = document.getElementById("fileInput");
  // "+" menu: attach, mention, poll. Closes on pick, outside click or Escape.
  const plusBtn = document.getElementById("plusBtn"), plusMenu = document.getElementById("plusMenu");
  const togglePlus = (open = plusMenu.hidden) => { plusMenu.hidden = !open; plusBtn.setAttribute("aria-expanded", String(open)); };
  plusBtn.onclick = (e) => { e.stopPropagation(); togglePlus(); };
  plusMenu.onclick = () => togglePlus(false);
  plusMenu.closest("main").addEventListener("click", (e) => { if (!plusMenu.hidden && !plusMenu.contains(e.target)) togglePlus(false); });
  plusMenu.onkeydown = (e) => { if (e.key === "Escape") { togglePlus(false); plusBtn.focus(); } };
  document.getElementById("mentionBtn").onclick = () => {
    const at = input.selectionStart ?? input.value.length, before = input.value.slice(0, at);
    const ins = before && !/\s$/.test(before) ? " @" : "@";
    input.value = before + ins + input.value.slice(at);
    input.focus(); input.setSelectionRange(at + ins.length, at + ins.length);
    setTimeout(() => input.oninput(), 120); // after input.onblur's delayed closePop
  };
  document.getElementById("attach").onclick = () => fileInput.click();
  fileInput.onchange = () => { addFiles([...fileInput.files]); fileInput.value = ""; };
  // Cmd+V of a screenshot: some apps (CleanShot…) only fill clipboardData.items, and focus may be outside the box.
  document.onpaste = (e) => {
    const t = e.target, typing = t instanceof HTMLElement && (t.isContentEditable || /^(INPUT|TEXTAREA)$/.test(t.tagName));
    if (!input.isConnected || (typing && t !== input)) return;
    let files = [...(e.clipboardData?.files ?? [])];
    if (!files.length) files = [...(e.clipboardData?.items ?? [])].filter((i) => i.kind === "file").map((i) => i.getAsFile()).filter(Boolean);
    if (files.length) { e.preventDefault(); addFiles(files); input.focus(); }
  };
  const chatEl = $app.querySelector(".chat");
  chatEl.addEventListener("dragover", (e) => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); chatEl.classList.add("drop"); } });
  chatEl.addEventListener("dragleave", (e) => { if (!chatEl.contains(e.relatedTarget)) chatEl.classList.remove("drop"); });
  chatEl.addEventListener("drop", (e) => { e.preventDefault(); chatEl.classList.remove("drop"); addFiles([...e.dataTransfer.files]); });

  document.getElementById("composer").onsubmit = (e) => {
    e.preventDefault();
    if (attached.some((p) => !p.meta && !p.error)) return;
    const text = input.value.trim();
    const files = attached.filter((p) => p.meta).map((p) => p.meta.id);
    if (!text && !files.length) return;
    send({ t: "msg", thread, text, files });
    attached.forEach((p) => p.url && URL.revokeObjectURL(p.url)); attached = [];
    input.value = ""; input.oninput(); renderTray();
  };

  // Polls: create via dialog, vote/close via delegation on the message list.
  const dlg = document.getElementById("pollDlg");
  const opts = document.getElementById("pollOpts");
  const addOpt = (v = "") => { opts.insertAdjacentHTML("beforeend", `<input name="opt" maxlength="200" placeholder="Opção ${opts.children.length + 1}" value="${esc(v)}" />`); };
  document.getElementById("pollBtn").onclick = () => { document.getElementById("pollForm").reset(); opts.innerHTML = ""; addOpt(); addOpt(); addOpt(); dlg.showModal(); };
  document.getElementById("addOpt").onclick = () => { if (opts.children.length < 10) addOpt(); opts.lastElementChild.focus(); };
  document.getElementById("pollCancel").onclick = () => dlg.close();
  document.getElementById("pollForm").onsubmit = (e) => {
    e.preventDefault();
    const f = e.target;
    const options = [...f.querySelectorAll('[name="opt"]')].map((i) => i.value.trim()).filter(Boolean);
    if (options.length < 2) return alert("Coloque pelo menos 2 opções.");
    send({ t: "poll.create", thread, question: f.q.value, options, multi: f.multi.checked });
    dlg.close();
  };
  document.getElementById("msgs").addEventListener("click", (e) => {
    const v = e.target.closest("[data-vote]");
    if (v) return send({ t: "vote", id: v.closest("[data-poll]").dataset.poll, opt: Number(v.dataset.vote) });
    const c = e.target.closest("[data-close]");
    if (c && confirm("Encerrar a votação?")) send({ t: "poll.close", id: c.dataset.close });
  });

  // Right panel: Documento / Arquivos
  const setPane = (pane) => {
    $app.querySelector(".doc").dataset.pane = pane;
    $app.querySelectorAll(".ptabs button").forEach((b) => { b.classList.toggle("sel", b.dataset.pane === pane); b.setAttribute("aria-selected", b.dataset.pane === pane); });
    if (pane === "files") renderFiles();
    if (pane === "decisions") renderDecisions();
  };
  $app.querySelectorAll(".ptabs button").forEach((b) => b.onclick = () => setPane(b.dataset.pane));
  setPane("doc");
  const doc = document.getElementById("doc");
  let timer;
  doc.oninput = () => { clearTimeout(timer); timer = setTimeout(() => { S.doc = doc.value; send({ t: "doc", text: doc.value }); }, 400); };
  doc.onblur = () => renderDoc();
  const docPanel = $app.querySelector(".doc");
  const setView = (v) => {
    docPanel.dataset.view = v;
    docPanel.querySelectorAll(".seg button").forEach((b) => b.classList.toggle("sel", b.dataset.view === v));
    try { localStorage.setItem("vb.docView", v); } catch {}
    if (v === "edit") doc.focus(); else renderDoc();
  };
  docPanel.querySelectorAll(".seg button").forEach((b) => b.onclick = () => setView(b.dataset.view));
  let savedView = "preview"; try { savedView = localStorage.getItem("vb.docView") || "preview"; } catch {}
  docPanel.dataset.view = savedView;
  docPanel.querySelectorAll(".seg button").forEach((b) => b.classList.toggle("sel", b.dataset.view === savedView));
  renderSide(); renderChat(); renderDoc(true); renderFiles(); renderDecisions(); nudgeAgent(); renderBells();
}

const SIDEBAR_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>`;
const bookTitle = () => S?.book?.title || "vibebook";
const COVERS = ["oklch(0.5 0.17 248)", "oklch(0.58 0.17 35)", "oklch(0.52 0.11 175)", "oklch(0.47 0.15 315)", "oklch(0.6 0.13 75)", "oklch(0.45 0.1 145)", "oklch(0.36 0.06 255)", "oklch(0.55 0.16 10)"];
const coverColor = (t) => COVERS[[...String(t)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % COVERS.length];
const STOP = new Set(["e", "de", "do", "da", "dos", "das", "o", "a", "os", "as", "em", "no", "na", "para", "pra", "com", "por", "the", "and", "of"]);
const initials = (t) => {
  const words = t.replace(/[^\p{L}\p{N} ]/gu, " ").trim().split(/\s+/).filter(Boolean);
  const main = words.filter((w) => !STOP.has(w.toLowerCase()));
  return ((main.length ? main : words).slice(0, 2).map((w) => w[0]).join("") || "◆").toUpperCase();
};
// Tab icon = the room's card: its cover color with its initials (canvas, so oklch and Caprasimo just work).
async function setFavicon(title) {
  const link = document.querySelector('link[rel="icon"]');
  if (!title) { link.type = "image/svg+xml"; link.href = "/favicon.svg"; return; }
  await document.fonts?.load?.('400 40px Caprasimo').catch(() => {});
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d");
  g.fillStyle = coverColor(title); g.beginPath(); g.roundRect(0, 0, 64, 64, 14); g.fill();
  const shine = g.createRadialGradient(56, 8, 0, 56, 8, 44); shine.addColorStop(0, "rgba(255,255,255,.28)"); shine.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = shine; g.fill();
  const txt = initials(title);
  g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
  g.font = `400 ${txt.length > 1 ? 30 : 38}px Caprasimo, Georgia, serif`;
  g.fillText(txt, 32, 35);
  link.type = "image/png"; link.href = c.toDataURL("image/png");
}

let railMode = false;

function toggleRail() {
  railMode = !railMode;
  try { localStorage.setItem("vb.rail", railMode ? "1" : "0"); } catch {}
  $app.querySelector(".book")?.classList.toggle("rail", railMode);
  renderSide();
}

      <button class="rb geral ${thread === "main" ? "sel" : ""}" style="background:${coverColor(bookTitle())}" data-thread="main" title="${esc(bookTitle())}" aria-label="${esc(bookTitle())}">${esc(initials(bookTitle()))}</button>
      ${S.epics.filter((e) => !e.archived || e.id === thread).map((e) => { const d = e.tasks.filter((t) => t.done).length, pct = e.tasks.length ? (100 * d) / e.tasks.length : 0; return `
        <button class="rb ${thread === e.id ? "sel" : ""}" data-thread="${e.id}" title="${esc(e.title)} · ${d}/${e.tasks.length}" aria-label="${esc(e.title)}" style="background:${color(e.title)}">

// A pre-epic: one of @vibe's suggestions, opened in the main panel like an epic, to create or discard.
const isPre = () => thread.startsWith("pre:");
const preOf = () => (isPre() ? S.suggestions[Number(thread.slice(4))] : null);
let pendingEpic = null; // title of a suggestion just accepted: open it once the epic exists
let skipFrom = null; // index of a suggestion just discarded: show the next one
function renderPre(el) {
  const s = preOf(); if (!s) { thread = "main"; return renderChat(); }
  el.innerHTML = `<div class="preCard">
    <p class="kicker">✦ O @vibe sugere um épico</p>
    <h3>${esc(s.title)}</h3>
    <p class="${s.why ? "" : "muted"}">${esc(s.why || "Ele viu isso na conversa e acha que vale virar um épico, com as tarefas abaixo.")}</p>
    ${s.tasks.length ? `<h4>Tarefas propostas</h4><ul>${s.tasks.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
    <div class="row"><button class="primary" id="preAccept">Criar épico</button><button class="ghost" id="preSkip">Descartar</button></div>
  </div>`;

  el.querySelector("#preAccept").onclick = () => { pendingEpic = s.title; send({ t: "suggestion", i, accept: true }); };
  el.querySelector("#preSkip").onclick = () => { skipFrom = i; send({ t: "suggestion", i }); };
}

      <form class="row" id="invite" style="margin-top:8px"><input type="email" required placeholder="convidar por email" list="friendList" autocomplete="off" /><button>+</button></form>

// Kanban over every epic's tasks. Drag between lanes, or focus a card and use ←/→. Click opens the epic's chat.
const LANES = [["todo", "A fazer"], ["doing", "Fazendo"], ["review", "Esperando OK"], ["done", "Feito"]];
let boardEpic = null;
function renderKanban() {
  const el = document.getElementById("kanban");
  if (!el || !$app.querySelector(".book.boardview")) return;
  if (boardEpic && !S.epics.some((e) => e.id === boardEpic)) boardEpic = null;
  const epics = S.epics.filter((e) => (boardEpic ? e.id === boardEpic : !e.archived));
  const tasks = epics.flatMap((e) => e.tasks.map((t) => ({ ...t, epic: e })));
  const card = (t) => `<div class="kcard ${t.status === "done" ? "done" : ""}" draggable="true" tabindex="0" data-k="${t.id}" data-status="${t.status}" data-epic="${t.epic.id}" title="Arraste, ou use ← →. Clique pra abrir o épico.">
      <div class="kt">${mentions(esc(t.title))}</div>
      <div class="km"><span class="kep" style="background:${color(t.epic.title)}">${esc(t.epic.title)}</span>${t.owner ? `${avatar(t.owner)}<span>${esc(t.owner === S.me ? "você" : name(t.owner))}</span>` : ""}${t.due ? `<span>📅 ${esc(t.due)}</span>` : ""}</div></div>`;
  el.innerHTML = S.epics.length ? `
    <div class="lanes">${LANES.map(([k, label]) => { const list = tasks.filter((t) => t.status === k); return `
      <section class="lane" data-lane="${k}"><h3>${label}<span>${list.length}</span></h3>
        <div class="cards">${list.map(card).join("") || `<div class="kempty">${k === "todo" ? "Nada a fazer." : "Arraste um card pra cá."}</div>`}</div>
        ${k === "todo" ? `<form class="kadd"><input placeholder="nova tarefa" aria-label="Nova tarefa" /><button>+</button>${boardEpic ? `<input type="hidden" name="epic" value="${boardEpic}" />` : `<select name="epic" aria-label="Épico">${S.epics.map((e) => `<option value="${e.id}">${esc(e.title)}</option>`).join("")}</select>`}</form>` : ""}
      </section>`; }).join("")}</div>`
    : `<div class="empty">Ainda não tem épico nem tarefa. Crie um épico na barra ao lado, ou peça: <b>@vibe</b> organiza o projeto em épicos e tarefas.</div>`;
  const move = (id, status) => send({ t: "task.status", id, status });
  el.querySelectorAll(".kcard").forEach((c) => {
    c.ondragstart = (e) => { e.dataTransfer.setData("text/plain", c.dataset.k); c.classList.add("dragging"); };
    c.ondragend = () => c.classList.remove("dragging");
    c.onclick = () => { thread = c.dataset.epic; document.getElementById("toggleBoard").click(); renderSide(); renderChat(); };
    c.onkeydown = (e) => {
      const i = LANES.findIndex(([k]) => k === c.dataset.status);
      if (e.key === "ArrowRight" && i < LANES.length - 1) move(c.dataset.k, LANES[i + 1][0]);
      if (e.key === "ArrowLeft" && i > 0) move(c.dataset.k, LANES[i - 1][0]);
      if (e.key === "Enter") c.click();
    };
  });
  el.querySelectorAll(".lane").forEach((l) => {
    l.ondragover = (e) => { e.preventDefault(); l.classList.add("over"); };
    l.ondragleave = () => l.classList.remove("over");
    l.ondrop = (e) => { e.preventDefault(); l.classList.remove("over"); const id = e.dataTransfer.getData("text/plain"); if (id) move(id, l.dataset.lane); };
  });
  el.querySelector(".kadd")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const title = e.target.querySelector("input").value.trim();
    if (title) send({ t: "task.add", epic: e.target.elements.epic.value, title });
    e.target.reset();
  });
}

function renderTasks() {
  const el = document.getElementById("tasks"); if (!el) return;
  const epic = S.epics.find((e) => e.id === thread);
  const head = document.getElementById("threadTitle");
  if (preOf()) { head.innerHTML = `<span class="epicName">${esc(preOf().title)}</span><small class="folderChip">✦ sugestão do @vibe</small>`; el.innerHTML = ""; return; }
  head.innerHTML = epic
    ? `<span class="epicName" id="roomName" title="Clique para renomear">${esc(epic.title)}</span><button class="ghost x" id="epicArch" title="${epic.archived ? "Desarquivar épico" : "Arquivar épico (concluído)"}" aria-label="${epic.archived ? "Desarquivar épico" : "Arquivar épico"}">${epic.archived ? "↩" : "✓"}</button><button class="ghost x" id="epicDel" title="Apagar épico" aria-label="Apagar épico">🗑</button>`
    : `<span class="epicName" id="roomName" title="${esc(S.book?.summary || "Clique para renomear")}">${esc(bookTitle())}</span>${S.book?.folder ? `<small class="folderChip">📁 ${esc(S.book.folder)}</small>` : ""}`;
  // Who is the room waiting on: open tasks with an owner, across every epic.
  const waiting = {};
  for (const t of S.epics.flatMap((e) => e.tasks)) if (!t.done && t.owner) waiting[t.owner] = (waiting[t.owner] || 0) + 1;
  const w = Object.entries(waiting).sort((a, b) => b[1] - a[1]);
  if (w.length) head.insertAdjacentHTML("beforeend", `<small class="waitChip" title="Tasks abertas por responsável">⏳ esperando ${w.map(([o, n]) => `${esc(o === S.me ? "você" : name(o))} ${n}`).join(" · ")}</small>`);
  document.getElementById("roomName").onclick = () => {
    const cur = epic ? epic.title : bookTitle();
    const t = prompt(epic ? "Nome do épico:" : "Nome do vibebook:", cur);
    if (!t?.trim() || t === cur) return;
    send(epic ? { t: "epic.rename", id: epic.id, title: t } : { t: "title", title: t });
  };
  el.style.display = epic ? "" : "none";
  if (!epic) return;
  document.getElementById("epicArch").onclick = () => send({ t: "epic.archive", id: epic.id, archived: !epic.archived });
  document.getElementById("epicDel").onclick = () => { if (confirm(`Apagar o épico "${epic.title}", as tasks e a discussão dele? Não dá pra desfazer.`)) send({ t: "epic.del", id: epic.id }); };
  el.innerHTML = `${epic.tasks.map((t) => `<div class="task ${t.done ? "done" : ""}" data-task="${t.id}">
      <input type="checkbox" ${t.done ? "checked" : ""} aria-label="Feita" /><span class="tt" title="Clique para editar">${esc(t.title)}</span>
      <select class="towner ${t.owner ? "set" : ""}" data-owner="${t.id}" aria-label="Responsável"><option value="">sem dono</option>${(S.members || []).map((e) => `<option value="${esc(e)}" ${t.owner === e ? "selected" : ""}>${esc(e === S.me ? "você" : name(e))}</option>`).join("")}</select>
      <button type="button" class="due ${t.due ? "set" : ""}" data-due="${t.id}" title="Prazo">${t.due ? `📅 ${esc(t.due)}` : "📅"}</button>
      <button class="ghost x" data-tdel="${t.id}" aria-label="Apagar task" title="Apagar task">×</button></div>`).join("")}
    <form class="row" id="newTask" style="margin-top:6px"><input placeholder="nova task" /><button>+</button></form>`;
  el.querySelectorAll("[data-task] input[type=checkbox]").forEach((c) => c.onchange = () => send({ t: "task.toggle", id: c.closest("[data-task]").dataset.task }));
  el.querySelectorAll("[data-task] .tt").forEach((sp) => sp.onclick = () => {
    const id = sp.closest("[data-task]").dataset.task;
    const inp = document.createElement("input"); inp.value = sp.textContent; inp.className = "tedit";
    sp.replaceWith(inp); inp.focus(); inp.select();
    const done = (save) => { if (save && inp.value.trim() && inp.value !== sp.textContent) send({ t: "task.rename", id, title: inp.value }); else inp.replaceWith(sp); };
    inp.onkeydown = (e) => { if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); };
    inp.onblur = () => done(true);
  });
  el.querySelectorAll("[data-tdel]").forEach((b) => b.onclick = () => send({ t: "task.del", id: b.dataset.tdel }));
  el.querySelectorAll("[data-owner]").forEach((sel) => sel.onchange = () => send({ t: "task.assign", id: sel.dataset.owner, owner: sel.value }));
  el.querySelectorAll("[data-due]").forEach((b) => b.onclick = () => {
    const cur = epic.tasks.find((t) => t.id === b.dataset.due)?.due || "";
    const v = prompt("Prazo (ex.: sex, qua 23h, 06/11). Vazio tira o prazo:", cur);
    if (v !== null) send({ t: "task.assign", id: b.dataset.due, due: v });
  });
  document.getElementById("newTask").onsubmit = (e) => { e.preventDefault(); send({ t: "task.add", epic: thread, title: e.target[0].value }); e.target.reset(); };
}

const fileUrl = (f) => `/api/books/${S.id}/files/${f.id}`;
const kb = (n) => n > 1e6 ? `${(n / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1e3))} KB`;
const attHtml = (files) => files?.length ? `<div class="atts">${files.map((f) => f.type.startsWith("image/")
  ? `<a href="${fileUrl(f)}" target="_blank" rel="noopener"><img src="${fileUrl(f)}" alt="${esc(f.name)}" loading="lazy" /></a>`
  : `<a class="fileChip" href="${fileUrl(f)}" target="_blank" rel="noopener">${fileIcon(f)} ${esc(f.name)} <small>${kb(f.size)}</small></a>`).join("")}</div>` : "";

function pollHtml(id) {
  const p = S.polls?.[id]; if (!p) return "";
  const counts = p.votes.map((v) => v.length);
  const sum = counts.reduce((a, b) => a + b, 0);
  const max = Math.max(...counts);
  const voters = new Set(p.votes.flat()).size;
  return `<div class="poll" data-poll="${id}">
    <div class="pq">📊 ${esc(p.question)}</div>
    ${p.options.map((o, i) => {
      const n = counts[i], pct = sum ? Math.round((100 * n) / sum) : 0, mine = p.votes[i].includes(S.me), win = p.closed && n > 0 && n === max;
      return `<button type="button" class="opt ${mine ? "mine" : ""} ${win ? "win" : ""}" data-vote="${i}" ${p.closed ? "disabled" : ""} aria-pressed="${mine}">
        <span class="fill" style="width:${pct}%"></span><span class="ol">${win ? "🏆 " : mine ? "✓ " : ""}${esc(o)}</span>
        <span class="stack">${p.votes[i].slice(0, 4).map((e) => avatar(e)).join("")}</span><span class="pc">${n ? `${pct}%` : ""}</span></button>`;
    }).join("")}
    <div class="pf">${voters} ${voters === 1 ? "pessoa votou" : "pessoas votaram"} · ${p.multi ? "pode escolher várias" : "escolha uma"}${p.closed ? " · encerrada" : p.author === S.me || p.author === "ai" ? ` · <button type="button" class="link" data-close="${id}">encerrar</button>` : ""}</div>
  </div>`;
}

const hhmm = (ts) => new Date(ts).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
// Same author (and kind), within 5 minutes, no poll in between: drop the name and avatar, keep the time on hover.
const continues = (prev, m) => !!prev && prev.author === m.author && (prev.kind || null) === (m.kind || null) && m.ts - prev.ts < 5 * 60_000 && !prev.poll && !m.poll;
const msgHtml = (m, prev) => {
  const cont = continues(prev, m);
  const txt = m.author === "ai" ? (m.text ? mentions(md(m.text)) : m.poll ? "" : `<span class="typing">pensando…</span>`) : m.text ? mentions(linkify(esc(m.text))) : "";
  return `
  <div class="msg ${m.author === "ai" ? "ai" : m.kind === "agent" ? "agent" : ""}${cont ? " cont" : ""}" id="m${m.id}">
    ${avatar(m.author)}${cont ? `<span class="gut" title="${esc(new Date(m.ts).toLocaleString("pt-BR"))}">${hhmm(m.ts)}</span>` : ""}
    <div class="body"><div class="who">${m.kind === "agent" ? `${esc(m.via || "agent")} de ${esc(name(m.author))} <span class="agentTag" title="Escrito pelo agent (Claude) dessa pessoa, em nome dela">✦ agent</span>` : esc(name(m.author))} · ${ago(m.ts)}<span class="hhmm" title="${esc(new Date(m.ts).toLocaleString("pt-BR"))}">${hhmm(m.ts)}</span></div>
      ${txt ? `<div class="txt">${txt}</div>` : `<div class="txt" hidden></div>`}${attHtml(m.files)}${m.poll ? pollHtml(m.poll) : ""}</div>
  </div>`;
};

function renderDecisions() {
  const el = document.getElementById("decPane"); if (!el) return;
  const list = S.decisions || [];
  document.getElementById("decCount").textContent = list.length ? ` ${list.length}` : "";
  el.innerHTML = list.length ? list.slice().reverse().map((d) => `<div class="dec ${d.kind === "approval" ? "approval" : ""}"><div>${esc(d.text)}<small>${d.kind === "approval" ? "✓ aprovado" : "decidido"} · ${esc(d.who)} · ${ago(d.ts)}</small></div>
      <button class="ghost x" data-ddel="${d.id}" aria-label="Apagar registro" title="Apagar registro">×</button></div>`).join("")
    : `<div class="empty">O que a sala decidir e cada aprovação aparecem aqui. O <b>@vibe</b> e os agents registram conforme a conversa anda.</div>`;
  el.querySelectorAll("[data-ddel]").forEach((b) => b.onclick = () => { if (confirm("Apagar esse registro?")) send({ t: "decision.del", id: b.dataset.ddel }); });
}

function renderFiles() {
  const el = document.getElementById("filesPane"); if (!el) return;
  document.getElementById("fileCount").textContent = S.files?.length ? ` ${S.files.length}` : "";
  el.innerHTML = S.files?.length ? `<div class="fgrid">${S.files.map((f) => `
    <a class="ftile" href="${fileUrl(f)}" target="_blank" rel="noopener" title="${esc(f.name)}">
      <div class="thumb">${f.type.startsWith("image/") ? `<img src="${fileUrl(f)}" alt="${esc(f.name)}" loading="lazy" />` : fileIcon(f)}</div>
      <b>${esc(f.name)}</b><small>${esc(name(f.author))} · ${ago(f.ts)} · ${kb(f.size)}</small></a>`).join("")}</div>`
    : `<div class="empty">Cole uma imagem no chat (Cmd+V), arraste um arquivo ou use o clipe. Tudo que for enviado neste vibebook fica aqui.</div>`;
}

function renderChat() {
  renderTasks();
  const el = document.getElementById("msgs");
  $app.querySelector(".book")?.classList.toggle("pre", isPre());
  if (isPre()) return renderPre(el);
  const list = S.messages.filter((m) => m.thread === thread);
  el.innerHTML = list.length ? list.map((m, i) => msgHtml(m, list[i - 1])).join("")
    : `<div class="empty">${thread === "main" ? "Comece a conversa. Ex.: <b>@vibe</b> organiza o projeto: site novo, aluguéis e domínio. Ou peça pro seu Claude: <i>vai na sala e fala com a Marina</i>." : "Discussão deste épico. O @vibe enxerga as tasks e a sala principal."}</div>`;
  scrollDown(true); pinOnLoad(el); renderReceipts();
}
// "✓✓ lido por" / "✓ entregue para": under the newest message each connected agent has read (or been told about)
// in this thread, skipping its own person's agent posts.
function renderReceipts() {
  const el = document.getElementById("msgs"); if (!el) return;
  el.querySelectorAll(".rcpt").forEach((x) => x.remove());
  const list = S.messages.filter((m) => m.thread === thread);
  const at = {};
  const put = (upto, r, kind) => {
    const m = list.findLast((x) => x.id <= upto && !(x.kind === "agent" && x.author === r.email));
    if (!m) return;
    const label = `${r.who} de ${name(r.email)}`;
    ((at[m.id] ??= { read: new Set(), delivered: new Set() })[kind]).add(label);
  };
  for (const r of S.receipts || []) { put(r.read, r, "read"); if (r.delivered > r.read) put(r.delivered, r, "delivered"); }
  for (const [id, g] of Object.entries(at)) {
    const body = document.querySelector(`#m${id} .body`); if (!body) continue;
    const parts = [g.read.size && `✓✓ lido por ${[...g.read].join(", ")}`, g.delivered.size && `✓ entregue para ${[...g.delivered].filter((l) => !g.read.has(l)).join(", ")}`].filter((x) => x && !x.endsWith("para "));
    if (parts.length) body.insertAdjacentHTML("beforeend", `<div class="rcpt">${esc(parts.join(" · "))}</div>`);
  }
}
function appendMsg(m) {
  const el = document.getElementById("msgs");
  el.querySelector(".empty")?.remove();
  const list = S.messages.filter((x) => x.thread === m.thread);
  el.insertAdjacentHTML("beforeend", msgHtml(m, list[list.indexOf(m) - 1]));
  scrollDown(true); pinOnLoad(el.lastElementChild); renderReceipts();
}
// Images change height after they load; keep pinned to the bottom when we were there.
let stick = true; // was the reader at the bottom of the chat?
// Messages grow after render (images, fonts, polls); stay pinned to the bottom if the reader was there.
const pinRO = new ResizeObserver(() => { const el = document.getElementById("msgs"); if (el && stick) el.scrollTop = el.scrollHeight; });
function pinOnLoad(root) {
  if (!root) return;
  (root.classList?.contains("msg") ? [root] : root.querySelectorAll(".msg")).forEach((m) => pinRO.observe(m));
}
function scrollDown(force) {
  const el = document.getElementById("msgs"); if (!el) return;
  // Only an upward scroll unpins; content growing below must not.
  el.onscroll ??= () => {
    const near = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    if (near) stick = true; else if (el.scrollTop < (el._lastTop ?? 0) - 2) stick = false;
    el._lastTop = el.scrollTop;
  };
  if (force) stick = true;
  if (force || el.scrollHeight - el.scrollTop - el.clientHeight < 200) el.scrollTop = el.scrollHeight;
}
// Mermaid via pele (obsidianmd/pele), loaded only when the doc has a ```mermaid block.
const PELE = "https://cdn.jsdelivr.net/npm/pele@1.10.0/dist/pele.global.js";
let peleP;
const loadPele = () => (peleP ??= new Promise((ok, no) => {
  const s = Object.assign(document.createElement("script"), { src: PELE, crossOrigin: "anonymous", integrity: "sha384-zwGYZK+/MVuyfItMWj4MERk2omW/eWEDLBEwuzSJd289OrEFwsdwQe+EqwJacKaA" });
  s.onload = () => ok(window.pele); s.onerror = () => { peleP = null; no(); };
  document.head.append(s);
}));
async function renderMermaid(pv) {
  const blocks = [...pv.querySelectorAll("pre > code.language-mermaid")];
  if (!blocks.length) return;
  const pele = await loadPele().catch(() => null);
  if (!pele) return;
  blocks.forEach((code, i) => {
    const fig = document.createElement("figure"); fig.className = "mmd";
    try {
      const { svg } = pele.render(code.textContent, { idPrefix: `mmd${i}-`, fontFamily: '"Schibsted Grotesk", sans-serif', fontSize: 14, maxWidth: pv.clientWidth - 90, links: false, images: false });
      // Doc is untrusted (people + AI): sanitize the SVG too.
      fig.innerHTML = DOMPurify.sanitize(svg, { USE_PROFILES: { svg: true, svgFilters: true } });
    } catch (e) {
      fig.classList.add("err");
      fig.textContent = `Diagrama com erro${e.line ? ` na linha ${e.line}` : ""}: ${e.message}`;
    }
    code.parentElement.replaceWith(fig);
  });
}
function renderDoc(force) {
  const doc = document.getElementById("doc"); if (!doc) return;
  // Doc is written by people and the AI: render markdown, then sanitize.
  const pv = document.getElementById("preview");
  pv.innerHTML = S.doc.trim()
    ? DOMPurify.sanitize(marked.parse(S.doc, { breaks: true, gfm: true }), { ADD_ATTR: ["target"] })
    : `<div class="empty">Documento vazio. Clique em <b>Editar</b> ou peça pro <b>@vibe</b> resumir as decisões aqui.</div>`;
  pv.querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener noreferrer nofollow ugc"; });
  renderMermaid(pv);
  // ponytail: last-writer-wins doc; don't clobber while someone is typing. CRDT (Yjs) if real co-editing matters.
  if (force || document.activeElement !== doc) doc.value = S.doc;
}

route();
</script>
</body>
