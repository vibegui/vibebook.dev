    --hover: light-dark(oklch(0.96 0.01 250), #161d2a);
    --serif: "Fraunces", Georgia, serif;

// First visit with no room yet (Gui, 13/11: the full home was too much at once): one step per screen, the same on
// phones. 1 your name (photo optional), 2 your Claude (the connect card, it moves on by itself once one connects;
// Pular remembers it), 3 your first room ("O que é e com quem?" = startRoom, which opens it). The step comes from the
// data, so a reload lands on the right one; "Pular e ver a home" turns it off in this browser.
let obBack = 0, obAgent = false;
const obOff = () => { try { return localStorage.getItem("vb.obDone") === "1"; } catch { return false; } };
function onboarding(me) {
  let skip = false; try { skip = localStorage.getItem("vb.obClaude") === "1"; } catch {}
  const step = obBack || (!me.name ? 1 : !obAgent && !skip ? 2 : 3);
  const of = t("Passo {n} de 3", { n: step });
  const dots = [1, 2, 3].map((i) => `<i class="${i === step ? "on" : i < step ? "ok" : ""}"></i>`).join("");
  const body = step === 1
    ? `<h1>${t("Como seus amigos te chamam?")}</h1><p class="muted">${t("O pessoal e os agents vão te chamar assim.")}</p>
      <form id="obName" class="obRow"><input name="n" required maxlength="60" value="${esc(me.name || "")}" placeholder="${t("Seu nome")}" autocomplete="given-name" /><button class="primary">${t("Continuar")}</button></form>
      <button type="button" class="ghost obPic" data-pic>${me.avatar ? avatar(me.email) : icon("camera")} ${me.avatar ? t("Trocar foto") : t("Adicionar foto (opcional)")}</button>`
    : step === 2
    ? `<h1>${t("Conecte seu Claude")}</h1><p class="muted">${t("No vibebook cada pessoa traz o próprio Claude: ele lê a sala, trabalha nas tarefas e te pergunta antes de agir. Cole isto no Claude Code, dentro da pasta do projeto:")}</p>
      <div id="obClaude"></div>
      <div class="obActs"><button type="button" class="ghost" data-back="1">${t("Voltar")}</button><button type="button" class="ghost" data-skip>${t("Pular por agora")}</button></div>`
    : `<h1>${t("Sua primeira sala")}</h1><p class="muted">${t("Uma sala por projeto: conversa, doc e tarefas. Diga o que é e com quem; quem você citar é convidado.")}</p>
      <form id="obRoom"><textarea name="t" rows="3" required placeholder="${t("Ex.: viagem de avião pra SP com os dogs, eu e a Alexia")}"></textarea></form>
      <p class="err" hidden></p>
      <div class="obActs"><button type="button" class="ghost" data-back="${obAgent ? 1 : 2}">${t("Voltar")}</button><button type="submit" form="obRoom" class="primary">${t("Criar a sala")}</button></div>`;
  $app.innerHTML = `<div class="onb">
    <header class="obTop"><div class="brand"><a href="/">vibebook</a></div>${langSwitch()}</header>
    <main class="obCard"><div class="obDots" aria-label="${of}">${dots}<span>${of}</span></div>${body}</main>
    <button type="button" class="ghost obOut" data-obdone>${t("Pular e ver a home")}</button>
    <input type="file" id="picFile" accept="image/png,image/jpeg,image/webp" hidden /></div>`;
  const redraw = () => homeWith(meCache || me);
  $app.querySelector("[data-pic]")?.addEventListener("click", pickPic);
  $app.querySelectorAll("[data-back]").forEach((b) => b.onclick = () => { obBack = Number(b.dataset.back); redraw(); });
  $app.querySelector("[data-obdone]").onclick = () => { try { localStorage.setItem("vb.obDone", "1"); } catch {} redraw(); };
  const name = document.getElementById("obName");
  if (name) {
    name.n.focus();
    name.onsubmit = async (e) => { e.preventDefault(); const n = name.n.value.trim(); if (!n) return; obBack = 0; keepMe(await api("/api/me", { name: n }).then(() => api("/api/me"))); redraw(); };
  }
  const claude = document.getElementById("obClaude");
  if (claude) {
    // Connected (now, or already): a second of ✓ when it just happened, then the next step.
    claude._onConnect = (fresh) => {
      if (fresh) claude.innerHTML = `<div class="setup done"><span class="setupIcon">${icon("check", 22)}</span><div><b>${t("Seu agent conectou.")}</b></div></div>`;
      setTimeout(() => { if (document.body.contains(claude)) { obAgent = true; obBack = 0; redraw(); } }, fresh ? 1500 : 0);
    };
    $app.querySelector("[data-skip]").onclick = () => { try { localStorage.setItem("vb.obClaude", "1"); } catch {} clearTimeout(setupPoll); obBack = 0; redraw(); };
    connectCard(claude);
  }
  const room = document.getElementById("obRoom");
  if (room) {
    const ta = room.t, err = $app.querySelector(".obCard .err"), go = $app.querySelector('[form="obRoom"]');
    ta.focus();
    ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); room.requestSubmit(); } };
    room.onsubmit = async (e) => {
      e.preventDefault();
      const text = ta.value.trim(); if (!text) return ta.focus();
      go.disabled = true; go.textContent = t("Criando…");
      try { await startRoom(text); } catch (x) { err.hidden = false; err.textContent = x.message; go.disabled = false; go.textContent = t("Criar a sala"); }
    };
  }
}

// Home composer: suggest the room/epic, then post there on one click and open it.
function wireAsk() {
  const form = document.getElementById("ask"), ta = document.getElementById("askText"), out = document.getElementById("askOut"), btn = document.getElementById("askBtn");
  if (!form) return;
  ta.oninput = () => { ta.style.height = "auto"; ta.style.height = `${ta.scrollHeight}px`; };
  ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } };
  const where = (p) => `<b>${esc(p.book_title)}</b>${p.epic_title ? ` → <b>${esc(p.epic_title)}</b>` : ""}`;
  // Destination first (picked, alternative or a new room); it's posted as typed, for the people and Claudes there.
  const go = async (dest) => {
    const text = ta.value.trim();
    out.innerHTML = `<div class="why">${t("Enviando…")}</div>`;
    try {
      if (!dest.book_id) return await startRoom(text);
      const bookId = dest.book_id;
      await api(`/api/books/${bookId}/post`, { text, thread: dest.epic_id || "main" });
      pendingThread = dest.epic_id || null;
      history.pushState(null, "", `/b/${bookId}`); route();
    } catch (err) { out.innerHTML = `<div class="why bad">${esc(err.message)}</div>`; }
  };
  form.onsubmit = async (e) => {
    e.preventDefault();
    const text = ta.value.trim(); if (!text) return;
    btn.disabled = true; out.hidden = false; out.innerHTML = `<div class="why">${t("Procurando a sala certa…")}</div>`;
    let r;
    try { r = await api("/api/route", { text }); } catch (err) { out.innerHTML = `<div class="why">${esc(err.message)}</div>`; btn.disabled = false; return; }
    btn.disabled = false;
    const short = (t) => (t.length > 40 ? `${t.slice(0, 38)}…` : t);
    const dests = [...[r.pick, ...r.alternatives].filter(Boolean), { book_id: null, epic_id: null, new_title: r.new_room_title }];
    let sel = 0;
    const label = (d) => (d.book_id ? where(d) : t("sala nova <b>“{title}”</b>", { title: esc(short(d.new_title)) }));
    const render = () => {
      const d = dests[sel];
      out.innerHTML = `<div class="where">${d.book_id ? t("Mandar em {where}?", { where: label(d) }) : r.pick ? t("Criar {where}?", { where: label(d) }) : t("Nenhuma sala parece a certa. Criar {where}?", { where: label(d) })}</div>
        ${sel === 0 && r.pick && r.reason ? `<div class="why">${esc(r.reason)}</div>` : ""}
        <div class="acts">
          <button type="button" class="primary" data-send="chat">${t("Enviar")}</button>
          <button type="button" class="ghost" data-cancel>${t("Cancelar")}</button>
        </div>
        ${dests.length > 1 ? `<div class="acts alts"><span class="why">${t("Outro lugar:")}</span>${dests.map((x, i) => (i === sel ? "" : `<button type="button" class="ghost" data-sel="${i}">${label(x)}</button>`)).join("")}</div>` : ""}`;
      out.querySelectorAll("[data-send]").forEach((b) => b.onclick = () => go(dests[sel]));
      out.querySelectorAll("[data-sel]").forEach((b) => b.onclick = () => { sel = Number(b.dataset.sel); render(); out.querySelector("[data-send]")?.focus(); });
      out.querySelector("[data-cancel]").onclick = () => { out.hidden = true; ta.focus(); };
    };
    render();
    out.querySelector("[data-send]")?.focus();
  };
}

// "Seu agent": connect instructions while none is connected (polled, so it flips to ✓ the moment the
// first MCP call lands), then the list of connections with a disconnect button.
let agentPoll = 0, agentPolls = 0;
async function renderAgents(again) {
  clearTimeout(agentPoll);
  agentPolls = again ? agentPolls + 1 : 0;
  const box = document.getElementById("agentBox");
  if (!box) return;
  const r = await fetch("/api/agents").then((x) => x.json()).catch(() => null);
  if (!r || !document.body.contains(box)) return;
  const url = `${location.origin}/mcp`;
  if (r.agents.length) {
    // One row per connection (each login or connector is one), grouped by client, newest first. Old or unused ones
    // come pre-checked; one button removes the checked ones.
    const DAY = 864e5, now = Date.now();
    const last = (a) => a.used_at ?? a.connected_at;
    const stale = (a) => now - last(a) > 14 * DAY;
    const groups = {};
    for (const a of r.agents) (groups[a.client] ??= []).push(a);
    for (const g of Object.values(groups)) g.sort((x, y) => last(y) - last(x));
    const usedTxt = (a) => a.used_at ? t("usado {ago}", { ago: ago(a.used_at) }) : a.used_at === null ? t("sem uso ainda") : t("uso desconhecido");
    box.innerHTML = `<h2>✦ ${t("Seus agents conectados")}</h2>
      ${Object.entries(groups).map(([client, list]) => `<div class="connGroup"><div class="connHead"><b>${esc(client)}</b><small>${list.length}</small></div>
        ${list.map((a) => `<label class="conn"><input type="checkbox" data-gid="${esc(a.id)}" ${stale(a) ? "checked" : ""} /><span>${t("conectado {ago}", { ago: ago(a.connected_at) })}<small>${usedTxt(a)}</small></span></label>`).join("")}</div>`).join("")}
      <div class="connActs"><button type="button" class="ghost" id="connKeep">${t("Marcar todas menos a mais recente de cada")}</button><button type="button" class="primary" id="connDel"></button></div>
      <p style="margin-top:8px">${t("Peça pro seu agent: <i>“vê o que tem de novo no vibebook”</i> ou <i>“vai na sala tal e fala com a Marina…”</i>")}</p>`;
    const boxes = () => [...box.querySelectorAll("[data-gid]")];
    const sync = () => { const n = boxes().filter((b) => b.checked).length; const d = box.querySelector("#connDel"); d.textContent = t("Remover selecionadas ({n})", { n }); d.disabled = !n; };
    box.addEventListener("change", sync); sync();
    box.querySelector("#connKeep").onclick = () => { box.querySelectorAll(".connGroup").forEach((g) => g.querySelectorAll("[data-gid]").forEach((b, i) => (b.checked = i > 0))); sync(); };
    box.querySelector("#connDel").onclick = async () => {
      const ids = boxes().filter((b) => b.checked).map((b) => b.dataset.gid);
      if (!ids.length || !confirm(t("Remover {n} conexões? Os agents delas perdem o acesso na hora.", { n: ids.length }))) return;
      await fetch("/api/agents/revoke", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ids }) });
      renderAgents();
    };
    return;
  }
  box.hidden = true;
  connectCard(document.getElementById("setupCard"));
}

      <a data-nav href="${href(w)}" data-wait-open="${i}">${inCard ? "" : tile(myBooks.find((b) => b.id === w.book_id) || { id: w.book_id, title: w.room }, "sm")}
        <span class="wt"><small>${inCard ? "" : `${esc(w.room)}${w.topic ? " › " : ""}`}${w.topic ? esc(w.topic) : inCard ? t("sala principal") : ""} · ${ago(w.ts)}</small>
        ${w.ref.startsWith("t") ? `<b>${t("Tarefa sua esperando OK:")}</b> ${esc(w.text)}` : `<b>${esc(who(w))}:</b> ${esc(w.text.length > 160 ? `${w.text.slice(0, 158)}…` : w.text)}`}</span></a>
      ${w.ref.startsWith("m") ? `<button class="ghost" data-wait-done="${i}" title="${t("Já resolvi (respondi em outro lugar, ou não é comigo)")}" aria-label="${t("Já resolvi (respondi em outro lugar, ou não é comigo)")}">${icon("check")}</button>` : ""}
    </li>`; };
  const n = document.getElementById("waitN");
  if (n) n.innerHTML = myWaits.length ? ` · <b class="waitTot">${t("{n} esperando você", { n: myWaits.length })}</b>` : "";
  // In a card: the asker's avatar (or a ✓ for your task in review), the ask itself, then where and when.
  const row = (w) => { const i = myWaits.indexOf(w), task = w.ref.startsWith("t"); return `<li>
      <a data-nav href="${href(w)}" data-wait-open="${i}"><span class="wIc${task ? " task" : ""}">${task ? icon("check", 16) : avatar(w.author)}</span>
        <span class="wt"><span class="wTx">${esc(w.text.length > 200 ? `${w.text.slice(0, 198)}…` : w.text)}</span>
        <small>${task ? t("sua tarefa esperando OK") : t("{who} pediu", { who: esc(who(w)) })} · ${w.topic ? esc(w.topic) : t("sala principal")} · ${ago(w.ts)}</small></span></a>
      ${w.ref.startsWith("m") ? `<button class="ghost" data-wait-done="${i}" title="${t("Já resolvi (respondi em outro lugar, ou não é comigo)")}" aria-label="${t("Já resolvi (respondi em outro lugar, ou não é comigo)")}">${icon("check")}</button>` : ""}
    </li>`; };
  document.querySelectorAll("[data-cw]").forEach((c) => {
    const ws = myWaits.filter((w) => w.book_id === c.dataset.cw);
    c.hidden = !ws.length;
    c.innerHTML = ws.length ? `<ul>${ws.slice(0, 3).map(row).join("")}</ul>${ws.length > 3 ? `<details><summary>${t("+{n} mais", { n: ws.length - 3 })}</summary><ul>${ws.slice(3).map(row).join("")}</ul></details>` : ""}` : "";
    const wc = document.querySelector(`[data-wc="${c.dataset.cw}"]`);
    if (wc) wc.innerHTML = ws.length ? `<b class="wChip">${t("{n} esperando você", { n: ws.length })}</b>` : "";
  });
  const el = document.getElementById("waits");
  if (el) {
    el.hidden = !myWaits.length;
    el.innerHTML = myWaits.length ? `<h2>${t("Esperando você")} <small>${myWaits.length}</small></h2><ul>${myWaits.map((w) => li(w, false)).join("")}</ul>` : "";
  }
  document.querySelectorAll("[data-wait-done]").forEach((b) => b.onclick = () => {
    const w = myWaits[Number(b.dataset.waitDone)];
    myWaits = myWaits.filter((x) => x !== w);
    renderWaits(); renderSwitcher();
    api("/api/waits/resolve", { book_id: w.book_id, ref: w.ref }).catch(() => {});
  });

// Caixa de entrada: the same waits as the home ("Esperando você": asks to you, your tasks in review, your Claude
// waiting on you), opened from any room, "Esta sala" or "Todas"; a click goes to the message, ✓ resolves an ask.
let inboxAll = false;
function syncInbox() {
  const b = document.getElementById("inboxBtn"); if (!b) return;

// The inbox is the first piece of the app in Svelte (svelte/Inbox.svelte → public/svelte/ui.js, loaded on first
// open, epic "Front-end framework evaluation"): the dialog and its CSS stay here, the component draws inside it.
let uiLoad;
const loadUI = () => (uiLoad ??= import("/svelte/ui.js"));
// Mentions and tasks come from /api/inbox (cross-room); waits are instant from /api/me (myWaits). The dialog opens at
// once with what we have, then the fetch fills the other two sections.
let inboxExtra = { mentions: [], tasks: [] };
function openInbox() {
  let d = document.getElementById("inbox");
  if (!d) { d = document.createElement("dialog"); d.id = "inbox"; d.className = "inbox"; document.body.appendChild(d); d.addEventListener("click", (e) => { if (e.target === d) d.close(); }); }
  loadUI().then(({ mountInbox }) => {
    const goTo = (bid, th, mid) => {
      d.close();
      if (S?.id === bid) { if (mid) goToMsg(mid, th); else if (th && th !== thread) { thread = th; renderSide(); renderChat(); renderDoc(); } }
      else location.href = `/b/${encodeURIComponent(bid)}${th && th !== "main" ? `?t=${encodeURIComponent(th)}` : ""}${mid ? `#m${mid}` : ""}`;
    };
    const draw = () => {
      d._unmount?.(); d.replaceChildren();
      d._unmount = mountInbox(d, {
        waits: myWaits, mentions: inboxExtra.mentions, tasks: inboxExtra.tasks,
        roomId: S?.id ?? null, all: inboxAll, vb: { t, icon, avatar, ago }, displayName: name,
        ontab: (v) => (inboxAll = v),
        onclose: () => d.close(),
        onopen: (w, e) => { e.preventDefault(); goTo(w.book_id, w.thread, /^[mab]/.test(w.ref) ? Number(w.ref.slice(1)) : 0); },
        onnav: (bid, th, mid) => goTo(bid, th, mid),
        onresolve: (w) => {
          myWaits = myWaits.filter((x) => x !== w);
          renderSwitcher(); renderWaits(); if (S) renderSide(); draw();
          api("/api/waits/resolve", { book_id: w.book_id, ref: w.ref }).catch(() => {});
        },
      });
    };
    draw();
    if (!d.open) d.showModal();
    fetch("/api/inbox").then((r) => r.json()).then((j) => {
      if (!j || j.error) return;
      if (Array.isArray(j.waits)) myWaits = j.waits;
      inboxExtra = { mentions: j.mentions || [], tasks: j.tasks || [] };
      if (d.open) draw();
      renderSwitcher(); renderWaits(); if (S) renderSide();
    }).catch(() => {});
  }).catch(() => toast(t("Não deu pra abrir agora. Tente de novo.")));
}

// First-class setup: vibebook assumes your Claude is connected. Until it is, the home and every room lead with one
// sentence to paste into Claude Code (it installs the plugin, does the one OAuth step, links the folder and listens),
// a Copy button, and a live "waiting" that turns green when your Claude shows up. Other clients are folded below.
let setupPoll = 0;
let noClaude = false; // no Claude connected at all (from /api/agents): then "Ligar Claude" means nothing yet
async function connectCard(el, room) {
  clearTimeout(setupPoll);
  if (!el) return;
  const r = await fetch("/api/agents").then((x) => x.json()).catch(() => null);
  if (!r || !document.body.contains(el)) return;
  noClaude = !r.agents.length;
  if (r.agents.length && el._onConnect) return el._onConnect(!!el.dataset.waiting);
  if (S && el.id === "agentNudge") renderMyClaude();
  if (r.agents.length) {
    if (el.dataset.waiting) {
      el.innerHTML = `<div class="setup done"><span class="setupIcon">${icon("check", 22)}</span><div><b>${t("Seu agent conectou.")}</b><span>${room ? t("Ele já enxerga esta sala. Liga ele aqui com ✻ Ligar agent no topo.") : t("Ele já enxerga as suas salas.")}</span></div></div>`;
      delete el.dataset.waiting;
      setTimeout(() => { if (document.body.contains(el)) { el.innerHTML = ""; el.hidden = true; } }, 6000);
      if (!room) renderAgents();
    } else { el.innerHTML = ""; el.hidden = true; }
    return;
  }
  // In a room, × hides this card for good (this browser); the home keeps it.
  const roomCard = el.id === "agentNudge";
  let setupOff = false; try { setupOff = localStorage.getItem("vb.setupOff") === "1"; } catch {}
  if (roomCard && setupOff) { el.innerHTML = ""; el.hidden = true; return; }
  const cmd = `Read ${location.origin}/llms.txt and set up vibebook for this project.${room ? ` Room: ${location.origin}/b/${room}` : ""}`;
  if (!el.dataset.waiting) {
    el.dataset.waiting = "1";
    el.hidden = false;

  if (bot && m.author !== S.me && !mentioned && m.for_who !== S.me && S.messages.find((x) => x.id === m.reply_to)?.author !== S.me) return;

  if (!away && !mentioned) return;
  chime();
  if (notifyPerm() === "granted" && document.hidden) {
    const who = m.author === "ai" ? "@vibe" : m.kind === "agent" ? t("{via} de {who}", { via: m.via || "agent", who: name(m.author) }) : name(m.author);

  }
}

function welcome() {

  const owner = name(S.book.owner);
  const steps = [
    [icon("hand", 24), t("Bem-vindo a <b>{room}</b>", { room: esc(S.book.title || t("esta sala")) }), t("{owner} te chamou pra cá. Cada conversa importante ganha uma sala no vibebook: o chat, as tarefas e o doc do projeto ficam juntos.", { owner: esc(owner) })],
    ["✻", t("Cada um traz o seu agent"), t("Você conecta o seu agent, no seu computador e com as suas permissões. Ele lê a sala, pega tarefas, atualiza os épicos e conta o que entregou. Só o que <b>você</b> escreve é instrução pra ele: o resto ele lê como contexto.")],
    [icon("paperclip", 24), t("O contexto é de todo mundo"), t("Doc, arquivos, decisões e tarefas ficam na sala, e todo agent lê o mesmo contexto antes de agir. Quando alguém passa o bastão ou fica esperando você, a sala mostra.")],

      <div class="wFoot"><span class="wDots">${steps.map((_, j) => `<i class="${j === i ? "on" : ""}"></i>`).join("")}</span>
        ${i ? `<button type="button" class="ghost" data-w="-1">${t("Voltar")}</button>` : `<button type="button" class="ghost" data-w="skip">${t("Pular")}</button>`}
        <button type="button" class="primary" data-w="1">${last ? t("Entrar na sala") : t("Próximo")}</button></div>`;
    d.querySelectorAll("[data-w]").forEach((b) => b.onclick = () => { const w = b.dataset.w; if (w === "skip" || (w === "1" && last)) return done(); i += Number(w); show(); });

    d.querySelector(".wFoot .primary").focus();

  d.addEventListener("cancel", (e) => { e.preventDefault(); done(); });

// Co-editing: in edit mode the doc is a CodeMirror bound to a Yjs doc on the room's DocRoom (/yjs/<room>[~<epic>]),
// with everyone's cursors. Loaded on first edit; if it can't load or connect, the plain textarea keeps working.
let collab = null, collabKey = null, collabLoad = null, collabGen = 0;
function ensureCollab() {
  const panel = $app.querySelector(".doc"), host = document.getElementById("cm");
  const ep = docEpic();
  const key = panel?.dataset.view === "edit" && S?.id && !isPre() ? (ep ? `${S.id}~${ep}` : S.id) : null;
  if (key === collabKey) return;
  collab?.destroy(); collab = null; collabKey = key;
  panel?.classList.remove("collab");
  if (host) host.innerHTML = "";
  // Only the newest request mounts: switching room/epic while the module loads (A → B → A) must not leave two editors.
  const gen = ++collabGen;
  if (!key || !host) return;
  (collabLoad ??= import("/collab.js")).then((m) => {
    if (gen !== collabGen) return;
    collab?.destroy(); host.innerHTML = "";
    collab = m.mountCollab(host, {
      room: key, name: name(S.me), color: color(S.me),
      onText: (t) => { if (gen !== collabGen) return; if (ep) S.docs[ep] = t; else S.doc = t; },
      onStatus: (s) => { if (gen !== collabGen) return; panel.classList.toggle("collab", s === "connected"); if (s !== "connected") renderDoc(true); },
    });
  }).catch(() => { collabLoad = null; });
}

const SIDEBAR_ICON = icon("sidebar", 20);
const bookTitle = () => S?.book?.title || "vibebook";
const COVERS = ["oklch(0.5 0.17 248)", "oklch(0.58 0.17 35)", "oklch(0.52 0.11 175)", "oklch(0.47 0.15 315)", "oklch(0.6 0.13 75)", "oklch(0.45 0.1 145)", "oklch(0.36 0.06 255)", "oklch(0.55 0.16 10)"];
const coverColor = (t) => COVERS[[...String(t)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % COVERS.length];
const STOP = new Set(["e", "de", "do", "da", "dos", "das", "o", "a", "os", "as", "em", "no", "na", "para", "pra", "com", "por", "the", "and", "of"]);
const initials = (t) => {
  const words = t.replace(/[^\p{L}\p{N} ]/gu, " ").trim().split(/\s+/).filter(Boolean);
  const main = words.filter((w) => !STOP.has(w.toLowerCase()));
  return ((main.length ? main : words).slice(0, 2).map((w) => w[0]).join("") || "◆").toUpperCase();
};

// Any image (ico included) → a square PNG, contained on transparent, for room icons.
async function squarePng(file, size) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(t("Não consegui ler essa imagem."))); i.src = url; });
    const c = document.createElement("canvas"); c.width = c.height = size;
    const k = Math.min(size / img.naturalWidth, size / img.naturalHeight), w = img.naturalWidth * k, h = img.naturalHeight * k;
    c.getContext("2d").drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
    return await new Promise((res) => c.toBlob(res, "image/png"));
  } finally { URL.revokeObjectURL(url); }
}
// Tab icon = the room's card: its cover color with its initials (canvas, so oklch and Caprasimo just work).
async function setFavicon(title) {
  const link = document.querySelector('link[rel="icon"]');
  if (!title) { link.type = "image/svg+xml"; link.href = "/favicon.svg"; return; }
  const own = iconUrl(myBooks?.find((b) => b.id === S?.id));
  // The room's own icon goes in rounded like the generated one: a square image (or one with a white backdrop)
  // otherwise shows white corners on a dark tab bar.
  if (own) {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = c.height = 64;
      const g = c.getContext("2d");
      g.beginPath(); g.roundRect(0, 0, 64, 64, 16); g.clip();
      g.drawImage(img, -1, -1, 66, 66); // 1px bleed: no light fringe from the image's own edge
      link.type = "image/png"; link.href = c.toDataURL("image/png");
    };
    img.onerror = () => { link.type = "image/png"; link.href = own; };
    img.src = own;
    return;
  }
  await document.fonts?.load?.('400 40px Caprasimo').catch(() => {});
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d");
  g.fillStyle = coverColor(title); g.beginPath(); g.roundRect(0, 0, 64, 64, 14); g.fill();
  const shine = g.createRadialGradient(56, 8, 0, 56, 8, 44); shine.addColorStop(0, "rgba(255,255,255,.28)"); shine.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = shine; g.fill();
  const txt = initials(title);
  g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
  g.font = `400 ${txt.length > 1 ? 30 : 38}px Caprasimo, Georgia, serif`;
  g.fillText(txt, 32, 35);
  link.type = "image/png"; link.href = c.toDataURL("image/png");
}

// Profile picture: pick, crop to a centered square, resize to 256px JPEG in the browser, upload.
function pickPic() {
  const input = document.getElementById("picFile"); if (!input) return;
  input.onchange = async () => {
    const f = input.files?.[0]; if (!f) return;
    try {
      const img = await createImageBitmap(f);
      const s = Math.min(img.width, img.height), c = document.createElement("canvas");
      c.width = c.height = 256;
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
      const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.86));
      const r = await fetch("/api/me/avatar", { method: "POST", headers: { "content-type": "image/jpeg" }, body: blob });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || t("Não deu para salvar a foto."));
      route();
    } catch (err) { alert(err.message || t("Não deu para ler essa imagem.")); }
  };
  input.click();
}

// The invite email gets them in; this is the message you send yourself (WhatsApp etc.): the room link and the
// one sentence that sets up their Claude. Copied on invite, and from "copiar" next to a pending invite.
function inviteText(email) {
  const url = `${location.origin}/b/${S.id}`;
  return `${t("Te convidei pro vibebook \"{title}\": {url}", { title: bookTitle(), url })}\n\n${t("1. Entra com {email} (o convite chegou nesse email).", { email })}\n${t("2. Manda isto pro seu Claude Code:")}\n\nRead ${location.origin}/llms.txt and set up vibebook for this project. Room: ${url}`;
}
function copyInvite(email, sent = true) {
  navigator.clipboard?.writeText(inviteText(email)).then(
    () => toast(`${sent ? `${t("Convite enviado por email para <b>{email}</b>.", { email: esc(email) })} ` : ""}${t("Copiei a mensagem com o link da sala e o setup do agent para {name}: cola no WhatsApp.", { name: esc(name(email)) })}`),
    () => toast(t("Não consegui copiar. Use \"copiar\" ao lado de {email} em Pessoas.", { email: esc(email) })),
  );
}
function toast(html, ms = 7000) {
  document.querySelector(".toast")?.remove();
  document.body.insertAdjacentHTML("beforeend", `<div class="toast" role="status">${html}</div>`);
  const t = document.querySelector(".toast"); setTimeout(() => t.remove(), ms);
}

// Kanban over every epic's tasks. Drag between lanes, or focus a card and use ←/→. Click opens the epic's chat.

// The task card's order (display only; the doc keeps its own): waiting on you first, then the rest as written, done last.
const shownOrder = (tasks) => {
  const waits = (tk) => myWaits.some((w) => w.book_id === S.id && w.ref === `t${tk.id}`);
  const rank = (tk) => (tk.done ? 2 : waits(tk) ? 0 : 1);
  return tasks.map((tk, i) => ({ tk, i })).sort((a, b) => rank(a.tk) - rank(b.tk) || a.i - b.i).map((x) => x.tk);
};

    const taskWaits = waitsIn(thread).some((w) => w.ref.startsWith("t")) || !!S.epics.find((e) => e.id === thread)?.tasks.some((t) => !t.done && t.owner === S.me);

// One status footer per message (.mfoot), the same line for every state: what Claudes are doing about it (acks) first,
// then who has read it (receipts). Color only says the state; only ⏸ (a Claude needs you in its terminal) stands out.
// Model ids read the same everywhere (prettyModel).
const prettyModel = (s) => String(s ?? "").replace(/^claude-(opus|sonnet|haiku|fable)-(\d+)-(\d+)(?:-\d{8})?$/i, (_, f, a, b) => `Claude ${f[0].toUpperCase()}${f.slice(1)} ${a}.${b}`);
// "Visto por": the readers stacked as faces with their agent's mark (✓ only delivered = faded), ≤5 then +N; hover or
// tap (focus) lists each one with its model and read/delivered.
function seenPill(rd) {
  rd.sort((a, b) => b.read - a.read);
  const face = ({ r, read }) => { const [k, g] = agentKind(r.who); return `<span class="sv${read ? "" : " dl"}">${avatar(r.email)}<i class="${k}">${g}</i></span>`; };
  const nRead = rd.filter((x) => x.read).length;
  const label = nRead === rd.length ? t("visto por {n}", { n: rd.length }) : t("visto por {n} de {m}", { n: nRead, m: rd.length });
  return `<button type="button" class="seen" aria-label="${label}">${rd.slice(0, 5).map(face).join("")}${rd.length > 5 ? `<span class="more">+${rd.length - 5}</span>` : ""}<span class="ck">${nRead ? "✓✓" : "✓"}</span>
    <span class="seenPop" role="tooltip">${rd.map((x) => `<div>${avatar(x.r.email)}<span>${x.who}</span><small>${x.read ? t("leu") : t("recebeu")}</small></div>`).join("")}</span></button>`;
}
function renderReceipts() {
  const el = document.getElementById("msgs"); if (!el) return;
  el.querySelectorAll(".mfoot").forEach((x) => x.remove());
  const foot = {}; // msg id → { st: [html], rd: [html] }
  const at = (id) => (foot[id] ??= { st: [], rd: [] });
  const via = (k) => t("{via} de {who}", { via: esc(prettyModel(k.who)), who: esc(name(k.email)) });
  const seenAck = new Set();
  for (const k of S.acks || []) {
    if (k.status === "dismissed") continue; // you took it out of your Claude's queue; nothing to show
    const key = `${k.msg_id}|${k.who}|${k.email}`;
    if (seenAck.has(key)) continue;
    seenAck.add(key);
    // "doing" is live only while the agent shows activity (post / task move bumps ts); 20 min quiet or idle =
    // nobody is on it now: say who the epic waits on (owners of its open tasks) instead of a spinner.
    const doing = k.status === "doing" && Date.now() - k.ts < 20 * 60e3;
    const who = via(k), when = `<time title="${esc(new Date(k.ts).toLocaleString(LOCALE))}">${ago(k.ts)}</time>`;
    let cls, ico, txt;
    if (k.status === "blocked") { cls = "need"; ico = "⏸"; txt = `${t("{who} espera você no terminal", { who })}${k.note ? `: <b>${esc(k.note)}</b>` : ""} · ${when}`; }
    else if (doing) { cls = "doing"; ico = `<span class="spin"></span>`; txt = `${t("{who} está fazendo isso", { who })} · ${when}`; }
    else if (k.status === "done") { cls = "did"; ico = "✓"; txt = t("{who} fez isso", { who }); }
    else {
      const owners = [...new Set((S.epics || []).filter((e) => e.from_msg === k.msg_id && !e.archived).flatMap((e) => e.tasks.filter((t) => t.status !== "done" && t.owner).map((t) => name(t.owner))))];
      if (owners.length) { cls = "wait"; ico = "⏳"; txt = t("aguardando {who}", { who: owners.map(esc).join(", ") }); }
      else { cls = "idle"; ico = "–"; txt = `${t("{who} parou", { who })} · ${when}`; }
    }

  // an agent that acked the message shows its ack instead. Its own person's agent posts don't count.

  for (const r of S.receipts || []) {
    const m = list.findLast((x) => x.id <= Math.max(r.read, r.delivered) && !(x.kind === "agent" && x.author === r.email));
    if (!m || seenAck.has(`${m.id}|${r.who}|${r.email}`)) continue;

  }
}

  if (isPermAnswer(m)) { const q = S.messages.find((x) => x.id === m.reply_to), box = document.querySelector(`#m${m.reply_to} .permAsk, #m${m.reply_to} .choice`); if (q && box) box.outerHTML = choiceHtml(q); return; }

  if (remKey(m) && remKey(prev) === remKey(m) && last?.id === `m${prev.id}`) {
    let j = i; while (j > 0 && remKey(list[j - 1]) === remKey(m)) j--;
    last.outerHTML = msgHtml(foldReminders(list.slice(j, i + 1))[0]);
  } else el.insertAdjacentHTML("beforeend", msgHtml(m, prev));
  // Your own message takes you to the bottom; anyone else's (a Claude working, @vibe) only when you were there.
  scrollDown(m.author === S.me && m.kind !== "agent"); pinOnLoad(el.lastElementChild); renderReceipts();
}
// Images change height after they load; keep pinned to the bottom when we were there.
let stick = true; // was the reader at the bottom of the chat?
// Messages grow after render (images, fonts, polls); stay pinned to the bottom if the reader was there.
const pinRO = new ResizeObserver(() => { const el = document.getElementById("msgs"); if (el && stick) el.scrollTop = el.scrollHeight; });
function pinOnLoad(root) {
  if (!root) return;
  (root.classList?.contains("msg") ? [root] : root.querySelectorAll(".msg")).forEach((m) => pinRO.observe(m));
}
function scrollDown(force) {
  const el = document.getElementById("msgs"); if (!el) return;
  // Only an upward scroll unpins; content growing below must not.
  el.onscroll ??= () => {
    const near = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    if (near) stick = true; else if (el.scrollTop < (el._lastTop ?? 0) - 2) stick = false;
    el._lastTop = el.scrollTop;
    if (el.scrollTop < 150 && !stick) loadOlder();
  };
  pinRO.observe(el); // the chat itself shrinks too (connect card, keyboard, composer growing): stay at the bottom
  // Rows that aren't messages (receipts, acks, the end mark, "working") land after the scroll too: watch every child,
  // and pin when one is added (opening a room stopped ~150px short of the bottom).
  el._mo ??= new MutationObserver((muts) => {
    for (const m of muts) m.addedNodes.forEach((n) => n.nodeType === 1 && pinRO.observe(n));
    if (stick) el.scrollTop = el.scrollHeight;
  });
  el._mo.observe(el, { childList: true });
  for (const c of el.children) pinRO.observe(c);
  if (force) stick = true;
  if (force || el.scrollHeight - el.scrollTop - el.clientHeight < 200) el.scrollTop = el.scrollHeight;
}
// Mermaid via pele (obsidianmd/pele), loaded only when the doc has a ```mermaid block.
const PELE = "https://cdn.jsdelivr.net/npm/pele@1.10.0/dist/pele.global.js";
let peleP;
const loadPele = () => (peleP ??= new Promise((ok, no) => {
  const s = Object.assign(document.createElement("script"), { src: PELE, crossOrigin: "anonymous", integrity: "sha384-zwGYZK+/MVuyfItMWj4MERk2omW/eWEDLBEwuzSJd289OrEFwsdwQe+EqwJacKaA" });
  s.onload = () => ok(window.pele); s.onerror = () => { peleP = null; no(); };
  document.head.append(s);
}));
async function renderMermaid(pv) {
  const blocks = [...pv.querySelectorAll("pre > code.language-mermaid")];
  if (!blocks.length) return;
  const pele = await loadPele().catch(() => null);
  if (!pele) return;
  blocks.forEach((code, i) => {
    const fig = document.createElement("figure"); fig.className = "mmd";
    try {
      const { svg } = pele.render(code.textContent, { idPrefix: `mmd${i}-`, fontFamily: '"Schibsted Grotesk", sans-serif', fontSize: 14, maxWidth: pv.clientWidth - 90, links: false, images: false });
      // Doc is untrusted (people + AI): sanitize the SVG too.
      fig.innerHTML = DOMPurify.sanitize(svg, { USE_PROFILES: { svg: true, svgFilters: true } });
    } catch (e) {
      fig.classList.add("err");
      fig.textContent = `${t("Diagrama com erro")}${e.line ? ` ${t("na linha {n}", { n: e.line })}` : ""}: ${e.message}`;
    }

}
// The epic's tasks live inside its doc, as a live section: where the doc has a "[[tarefas]]" line, else right
// after the first paragraph. The #tasks node is moved, not rebuilt, so renderTasks keeps owning its content.
function placeTasks(pv, ep) {
  const tk = document.getElementById("tasks"); if (!tk) return;
  const home = document.getElementById("tasksHome");
  if (!ep) { home.append(tk); return; }
  // The doc's "## Tarefas" checklist (kept in sync with the tasks by the server) shows as the live card.
  const h = [...pv.querySelectorAll("h2")].find((x) => x.textContent.trim().toLowerCase() === "tarefas");
  if (h) { const ul = h.nextElementSibling?.tagName === "UL" ? h.nextElementSibling : null; ul?.remove(); return h.replaceWith(tk); }
  const mark = [...pv.querySelectorAll("p")].find((p) => p.textContent.trim().toLowerCase() === "[[tarefas]]");
  if (mark) return mark.replaceWith(tk);
  const first = [...pv.children].find((x) => x.tagName === "P");
  first ? first.after(tk) : pv.prepend(tk);
}
// The doc panel follows the open epic (its own doc, a child of the room's); "Sala" in the crumb shows the room's.
let docRoom = false, docShown = null;
// Epic docs come one at a time: the room's state carries only the open epic's (Book.epicDocs), the rest on "doc.get".
const docAsked = new Set();
const docEpic = () => (!docRoom && !isPre() && S.epics.some((e) => e.id === thread) ? thread : null);
function renderDoc(force) {
  const doc = document.getElementById("doc"); if (!doc) return;
  S.docs ??= {};
  // Older epics without a doc open with the same start new ones get (epicDocSeed in src/book.ts).
  const ep = docEpic(), epic = ep && S.epics.find((e) => e.id === ep);
  if (ep && !(ep in S.docs) && !docAsked.has(S.id + ep)) { docAsked.add(S.id + ep); send({ t: "doc.get", epic: ep }); }
  const text = ep ? S.docs[ep] || `# ${epic.title}\n\n**Objetivo:** o que este épico entrega e por quê (edite aqui ou peça pro seu Claude).\n\n## Contexto\n\n- \n\n## Decisões\n\n- \n` : S.doc;
  if (docShown !== (ep || "room")) { force = true; docShown = ep || "room"; }
  ensureCollab();
  const inEpic = !isPre() && S.epics.find((e) => e.id === thread);
  const crumb = document.getElementById("docCrumb");
  crumb.hidden = !inEpic;
  if (inEpic) {
    crumb.innerHTML = `<button type="button" class="${ep ? "" : "sel"}" data-docroom="1">${esc(bookTitle())}</button><span>›</span><button type="button" class="${ep ? "sel" : ""}" data-docroom="">${esc(inEpic.title)}</button>`;
    crumb.querySelectorAll("button").forEach((b) => b.onclick = () => { docRoom = !!b.dataset.docroom; renderDoc(true); });
  }
  // Doc is written by people and the AI: render markdown, then sanitize.
  const pv = document.getElementById("preview");
  const tk = document.getElementById("tasks"); if (tk) document.getElementById("tasksHome").append(tk); // keep it out of the innerHTML wipe
  pv.innerHTML = text.trim()
    ? DOMPurify.sanitize(marked.parse(text, { breaks: true, gfm: true }), { ...MD_PURIFY, FORBID_TAGS: MD_PURIFY.FORBID_TAGS.filter((x) => x !== "img"), ADD_ATTR: ["target"] }) // the doc keeps images (screenshots of the room's files)
    : `<div class="empty">${t("Documento vazio. Clique em <b>Editar</b> ou peça pro seu agent resumir as decisões aqui.")}</div>`;
  pv.querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener noreferrer nofollow ugc"; });
  // @vibe's grade of the room doc (Jev): what the scope still misses. Only on the room's doc, not an epic's.
  if (!ep && S.docNotes?.length) pv.insertAdjacentHTML("afterbegin", `<div class="docNotes" title="${t("@vibe avaliou este doc. O agent de cada um também recebe isso (doc_notes).")}">${S.docNotes.map((n) => `<span class="vnote">${icon("alert", 12)} ${esc(n)}</span>`).join("")}</div>`);
  renderMermaid(pv);
  placeTasks(pv, ep || (thread === "main" && S.roomTasks?.length ? "main" : null));
  renderPeek();
  // ponytail: last-writer-wins doc; don't clobber while someone is typing. CRDT (Yjs) if real co-editing matters.
  if (force || document.activeElement !== doc) doc.value = text;
}

// Face ID lock (this device): a passkey of the device's own authenticator (user verification required, so Face ID /
// Touch ID / the device code) gates opening the app and coming back after 5 min away. A local lock like a bank app's,
// not a login: the server isn't involved and the session works as before. Credential id in localStorage (vb.lock).
const LOCK_AFTER = 5 * 60e3;
function lockId() { try { return localStorage.getItem("vb.lock"); } catch { return null; } }
const rnd = (n) => crypto.getRandomValues(new Uint8Array(n));
const lockVerify = () => navigator.credentials.get({ publicKey: { challenge: rnd(32), allowCredentials: [{ type: "public-key", id: Uint8Array.from(atob(lockId()), (c) => c.charCodeAt(0)) }], userVerification: "required", hints: ["client-device"], timeout: 60e3 } });
async function lockSet(on, email) {
  if (!on) { localStorage.removeItem("vb.lock"); return; } // you're already in (unlocked): no second check
  const c = await navigator.credentials.create({ publicKey: {
    challenge: rnd(32), rp: { name: "vibebook" }, user: { id: rnd(16), name: email, displayName: t("vibebook (trava do app)") },
    pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
    // Discoverable (resident) so iOS lists it by itself, from iCloud or 1Password; a non-discoverable one in 1Password
    // didn't show up ("não há chaves-senha salvas para este site") until picked by hand.
    authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "required", requireResidentKey: true }, hints: ["client-device"], timeout: 60e3,
  } });
  localStorage.setItem("vb.lock", btoa(String.fromCharCode(...new Uint8Array(c.rawId))));
}
function lockScreen() {
  if (!lockId() || document.getElementById("lockScreen")) return;
  const el = document.createElement("div");
  el.id = "lockScreen";
  el.innerHTML = `<img src="/favicon.svg" alt="" width="64" height="64" /><b>vibebook</b><button class="primary">${t("Desbloquear com Face ID")}</button><p class="err" hidden></p>`;
  document.body.append(el);
  const go = async () => {
    try { await lockVerify(); el.remove(); }
    catch { const e = el.querySelector(".err"); e.hidden = false; e.textContent = t("Toque pra tentar de novo."); }
  };
  // No automatic attempt: iOS wants the tap, and an untapped call surfaced "não é possível usar a chave de acesso".
  el.querySelector("button").onclick = go;
}
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > LOCK_AFTER) lockScreen();
});
lockScreen();
route();
</script>
