  el.innerHTML = S.files?.length ? `<div class="fgrid">${S.files.map((f) => `
    <a class="ftile" href="${fileUrl(f)}" target="_blank" rel="noopener" title="${esc(f.name)}">
      <div class="thumb">${f.type.startsWith("image/") ? `<img src="${fileUrl(f)}" alt="${esc(f.name)}" loading="lazy" />` : fileIcon(f)}</div>
      <b>${esc(f.name)}</b><small>${esc(name(f.author))} · ${ago(f.ts)} · ${kb(f.size)}</small></a>`).join("")}</div>`
    : `<div class="empty">Cole uma imagem no chat (Cmd+V), arraste um arquivo ou use o clipe. Tudo que for enviado neste vibebook fica aqui.</div>`;
}

// Sliding window: a thread renders its newest WIN messages; scrolling near the top shows WIN more, first from
// what the state already has, then from the room (WS "older", 100 at a time) until the start of the thread.
const WIN = 60;
let win = { thread: null, n: WIN }, olderDone = {}, olderBusy = false;
// The open thread lives in the URL (/b/<room>?t=<epic>): refresh, back and shared links land on it.
let urlSynced = false;
function syncUrl() {
  if (!S) return;
  const want = `/b/${S.id}${thread !== "main" && !isPre() ? `?t=${encodeURIComponent(thread)}` : ""}`;
  if (location.pathname + location.search !== want) history[urlSynced ? "pushState" : "replaceState"](null, "", want);
  urlSynced = true;
}
function renderChat(keep) {
  syncUrl();
  renderTasks();
  const el = document.getElementById("msgs");
  $app.querySelector(".book")?.classList.toggle("pre", isPre());
  if (isPre()) return renderPre(el);
  // Opening an epic with no conversation yet: show its doc (goal + tasks) instead of an empty panel, if it was closed.
  if (win.thread !== thread || win.room !== S.id) {
    const bk = $app.querySelector(".book");
    const taskWaits = waitsIn(thread).some((w) => w.ref.startsWith("t")) || !!S.epics.find((e) => e.id === thread)?.tasks.some((t) => !t.done && t.owner === S.me);
    if (thread !== "main" && bk?.classList.contains("nodoc") && !bk.classList.contains("boardview") && (taskWaits || !S.messages.some((m) => m.thread === thread))) bk.classList.remove("nodoc");
    // Point at what's yours here: what's waiting on you (tasks, messages), else your own open tasks. Bring the first
    // into view and let them shine (a sweep of light over the item itself, nothing clipped).
    if (thread !== "main" || waitsIn(thread).length) setTimeout(() => {
      let els = [...document.querySelectorAll(".task.waitTask, .msg.waitMsg .txt")];
      if (!els.length) els = [...document.querySelectorAll(".task.mine")];
      els[0]?.scrollIntoView({ block: "center", behavior: "smooth" });
      els.forEach((x) => { x.classList.remove("shimmer"); void x.offsetWidth; x.classList.add("shimmer"); });
    }, 400);
  }
  if (win.thread !== thread || win.room !== S.id) win = { thread, room: S.id, n: WIN };
  const all = S.messages.filter((m) => m.thread === thread);
  const list = all.slice(-win.n);
  const more = all.length > list.length || (all.length && !S.complete && !olderDone[S.id + thread]);
  const h0 = el.scrollHeight, t0 = el.scrollTop;
  el.innerHTML = list.length ? (more ? `<div class="older"><button class="ghost" id="olderBtn">Carregar mensagens anteriores</button></div>` : "") + list.map((m, i) => msgHtml(m, i ? list[i - 1] : all[all.length - list.length - 1])).join("")
    : `<div class="empty">${thread === "main" ? "Comece a conversa. Os Claudes ligados nesta sala leem e respondem; o seu age com o seu OK. Ex.: <i>organiza o projeto em épicos: site novo, aluguéis e domínio</i>." : "Discussão deste épico. Os Claudes leem as tarefas, o doc e a sala principal."}</div>`;
  document.getElementById("olderBtn")?.addEventListener("click", loadOlder);
  // A thread starts with the request that opened it (the epic's message in main), like a Slack thread's parent.
  const src = S.epics.find((e) => e.id === thread)?.from_msg, srcMsg = src && S.messages.find((x) => x.id === src);
  if (srcMsg) {
    el.querySelector(".empty")?.classList.add("afterOrigin");
    // Under "Carregar mensagens anteriores" (that button always sits at the very top), above the replies.
    const n = all.length, older = el.querySelector(".older");
    (older || el).insertAdjacentHTML(older ? "afterend" : "afterbegin", `<div class="origin">${msgHtml(srcMsg).replace(`id="m${src}"`, "")}<div class="replies"><span>${n} ${n === 1 ? "resposta" : "respostas"}</span><button type="button" class="ghost" data-gomain="${src}">ver na sala principal ↩</button></div></div>`);
    el.querySelectorAll(".origin .tcard").forEach((x) => x.remove());
  }
  renderWorking();
  if (keep) { el.scrollTop = t0 + el.scrollHeight - h0; renderReceipts(); pinOnLoad(el); }
  else { scrollDown(true); pinOnLoad(el); renderReceipts(); }
}
function loadOlder() {
  if (olderBusy || isPre()) return;
  const all = S.messages.filter((m) => m.thread === thread);
  if (all.length > win.n) { win.n += WIN; return renderChat(true); }
  if (S.complete || olderDone[S.id + thread] || !all.length) return;
  olderBusy = true;
  send({ t: "older", thread, before: all[0].id });
}
// Receipts: under the newest message each connected agent has read (or been told about)
// in this thread, skipping its own person's agent posts.
function renderReceipts() {
  const el = document.getElementById("msgs"); if (!el) return;
  el.querySelectorAll(".rcpt, .ack").forEach((x) => x.remove());
  const seenAck = new Set();
  for (const k of S.acks || []) {
    if (seenAck.has(`${k.msg_id}|${k.who}|${k.email}`)) continue;
    seenAck.add(`${k.msg_id}|${k.who}|${k.email}`);
    const body = document.querySelector(`#m${k.msg_id} .body`); if (!body) continue;
    // "doing" is live only while the agent shows activity (post / task move bumps ts); 20 min quiet or idle =
    // nobody is on it now: say who the epic waits on (owners of its open tasks) instead of a spinner.
    const doing = k.status === "doing" && Date.now() - k.ts < 20 * 60e3;
    const who = `${esc(k.who)} de ${esc(name(k.email))}`;
    let html;
    if (doing) html = `<span class="spin"></span>${who} está fazendo isso · ${ago(k.ts)}`;
    else if (k.status === "done") html = `✓ ${who} fez isso`;
    else {
      const owners = [...new Set((S.epics || []).filter((e) => e.from_msg === k.msg_id && !e.archived).flatMap((e) => e.tasks.filter((t) => t.status !== "done" && t.owner).map((t) => name(t.owner))))];
      html = owners.length ? `⏳ aguardando ${owners.map(esc).join(", ")}` : `${who} parou · ${ago(k.ts)}`;
    }
    body.insertAdjacentHTML("beforeend", `<div class="ack ${doing ? "doing" : k.status === "done" ? "did" : "idle"}" title="${esc(new Date(k.ts).toLocaleString("pt-BR"))}">${html}</div>`);
  }
  // One compact line per message: each agent once (✓✓ read, ✓ delivered), full name on hover; an agent that
  // acked the message shows its ack instead.
  const list = S.messages.filter((m) => m.thread === thread);
  const acked = new Set((S.acks || []).map((k) => `${k.msg_id}|${k.who}|${k.email}`));
  const at = {};
  // Each agent once, at the newest message it reached: ✓✓ if it read that far, ✓ if only delivered.
  for (const r of S.receipts || []) {
    const m = list.findLast((x) => x.id <= Math.max(r.read, r.delivered) && !(x.kind === "agent" && x.author === r.email));
    if (!m || acked.has(`${m.id}|${r.who}|${r.email}`)) continue;
    (at[m.id] ??= new Map()).set(`${r.who}|${r.email}`, { r, read: r.read >= m.id });
  }
  for (const [id, g] of Object.entries(at)) {
    const body = document.querySelector(`#m${id} .body`); if (!body) continue;
    const chips = [...g.values()].map(({ r, read }) => `<span class="${read ? "rd" : ""}" title="${read ? "lido" : "entregue, ainda não lido"} por ${esc(r.who)} de ${esc(name(r.email))}">${read ? "✓✓" : "✓"} ${esc(r.who)}</span>`);
    body.insertAdjacentHTML("beforeend", `<div class="rcpt">${chips.join("")}</div>`);
  }
}
function appendMsg(m) {
  const el = document.getElementById("msgs");
  el.querySelector(".empty")?.remove();
  const list = S.messages.filter((x) => x.thread === m.thread);
  el.insertAdjacentHTML("beforeend", msgHtml(m, list[list.indexOf(m) - 1]));
  scrollDown(true); pinOnLoad(el.lastElementChild); renderReceipts();
}
// Images change height after they load; keep pinned to the bottom when we were there.
let stick = true; // was the reader at the bottom of the chat?
// Messages grow after render (images, fonts, polls); stay pinned to the bottom if the reader was there.
const pinRO = new ResizeObserver(() => { const el = document.getElementById("msgs"); if (el && stick) el.scrollTop = el.scrollHeight; });
function pinOnLoad(root) {
  if (!root) return;
  (root.classList?.contains("msg") ? [root] : root.querySelectorAll(".msg")).forEach((m) => pinRO.observe(m));
}
function scrollDown(force) {
  const el = document.getElementById("msgs"); if (!el) return;
  // Only an upward scroll unpins; content growing below must not.
  el.onscroll ??= () => {
    const near = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    if (near) stick = true; else if (el.scrollTop < (el._lastTop ?? 0) - 2) stick = false;
    el._lastTop = el.scrollTop;
    if (el.scrollTop < 150 && !stick) loadOlder();
  };
  pinRO.observe(el); // the chat itself shrinks too (connect card, keyboard, composer growing): stay at the bottom
  if (force) stick = true;
  if (force || el.scrollHeight - el.scrollTop - el.clientHeight < 200) el.scrollTop = el.scrollHeight;
}
// Mermaid via pele (obsidianmd/pele), loaded only when the doc has a ```mermaid block.
const PELE = "https://cdn.jsdelivr.net/npm/pele@1.10.0/dist/pele.global.js";
let peleP;
const loadPele = () => (peleP ??= new Promise((ok, no) => {
  const s = Object.assign(document.createElement("script"), { src: PELE, crossOrigin: "anonymous", integrity: "sha384-zwGYZK+/MVuyfItMWj4MERk2omW/eWEDLBEwuzSJd289OrEFwsdwQe+EqwJacKaA" });
  s.onload = () => ok(window.pele); s.onerror = () => { peleP = null; no(); };
  document.head.append(s);
}));
async function renderMermaid(pv) {
  const blocks = [...pv.querySelectorAll("pre > code.language-mermaid")];
  if (!blocks.length) return;
  const pele = await loadPele().catch(() => null);
  if (!pele) return;
  blocks.forEach((code, i) => {
    const fig = document.createElement("figure"); fig.className = "mmd";
    try {
      const { svg } = pele.render(code.textContent, { idPrefix: `mmd${i}-`, fontFamily: '"Schibsted Grotesk", sans-serif', fontSize: 14, maxWidth: pv.clientWidth - 90, links: false, images: false });
      // Doc is untrusted (people + AI): sanitize the SVG too.
      fig.innerHTML = DOMPurify.sanitize(svg, { USE_PROFILES: { svg: true, svgFilters: true } });
    } catch (e) {
      fig.classList.add("err");
      fig.textContent = `Diagrama com erro${e.line ? ` na linha ${e.line}` : ""}: ${e.message}`;
    }
    code.parentElement.replaceWith(fig);
  });
}
// The epic's tasks live inside its doc, as a live section: where the doc has a "[[tarefas]]" line, else right
// after the first paragraph. The #tasks node is moved, not rebuilt, so renderTasks keeps owning its content.
function placeTasks(pv, ep) {
  const tk = document.getElementById("tasks"); if (!tk) return;
  const home = document.getElementById("tasksHome");
  if (!ep) { home.append(tk); return; }
  // The doc's "## Tarefas" checklist (kept in sync with the tasks by the server) shows as the live card.
  const h = [...pv.querySelectorAll("h2")].find((x) => x.textContent.trim().toLowerCase() === "tarefas");
  if (h) { const ul = h.nextElementSibling?.tagName === "UL" ? h.nextElementSibling : null; ul?.remove(); return h.replaceWith(tk); }
  const mark = [...pv.querySelectorAll("p")].find((p) => p.textContent.trim().toLowerCase() === "[[tarefas]]");
  if (mark) return mark.replaceWith(tk);
  const first = [...pv.children].find((x) => x.tagName === "P");
  first ? first.after(tk) : pv.prepend(tk);
}
// The doc panel follows the open epic (its own doc, a child of the room's); "Sala" in the crumb shows the room's.
let docRoom = false, docShown = null;
const docEpic = () => (!docRoom && !isPre() && S.epics.some((e) => e.id === thread) ? thread : null);
function renderDoc(force) {
  const doc = document.getElementById("doc"); if (!doc) return;
  S.docs ??= {};
  // Older epics without a doc open with the same start new ones get (epicDocSeed in src/book.ts).
  const ep = docEpic(), epic = ep && S.epics.find((e) => e.id === ep);
  const text = ep ? S.docs[ep] || `# ${epic.title}\n\n**Objetivo:** o que este épico entrega e por quê (edite aqui ou peça pro seu Claude).\n\n## Contexto\n\n- \n\n## Decisões\n\n- \n` : S.doc;
  if (docShown !== (ep || "room")) { force = true; docShown = ep || "room"; }
  ensureCollab();
  const inEpic = !isPre() && S.epics.find((e) => e.id === thread);
  const crumb = document.getElementById("docCrumb");
  crumb.hidden = !inEpic;
  if (inEpic) {
    crumb.innerHTML = `<button type="button" class="${ep ? "" : "sel"}" data-docroom="1">${esc(bookTitle())}</button><span>›</span><button type="button" class="${ep ? "sel" : ""}" data-docroom="">${esc(inEpic.title)}</button>`;
    crumb.querySelectorAll("button").forEach((b) => b.onclick = () => { docRoom = !!b.dataset.docroom; renderDoc(true); });
  }
  // Doc is written by people and the AI: render markdown, then sanitize.
  const pv = document.getElementById("preview");
  const tk = document.getElementById("tasks"); if (tk) document.getElementById("tasksHome").append(tk); // keep it out of the innerHTML wipe
  pv.innerHTML = text.trim()
    ? DOMPurify.sanitize(marked.parse(text, { breaks: true, gfm: true }), { ADD_ATTR: ["target"] })
    : `<div class="empty">Documento vazio. Clique em <b>Editar</b> ou peça pro seu Claude resumir as decisões aqui.</div>`;
  pv.querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener noreferrer nofollow ugc"; });
  // @vibe's grade of the room doc (Jev): what the scope still misses. Only on the room's doc, not an epic's.
  if (!ep && S.docNotes?.length) pv.insertAdjacentHTML("afterbegin", `<div class="docNotes" title="@vibe avaliou este doc. O Claude de cada um também recebe isso (doc_notes).">${S.docNotes.map((n) => `<span class="vnote">⚠ ${esc(n)}</span>`).join("")}</div>`);
  renderMermaid(pv);
  placeTasks(pv, ep);
  // ponytail: last-writer-wins doc; don't clobber while someone is typing. CRDT (Yjs) if real co-editing matters.
  if (force || document.activeElement !== doc) doc.value = text;
}

route();
