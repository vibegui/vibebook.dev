<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<title>vibebook</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(0.975 0.008 240); --panel: oklch(1 0 0); --line: oklch(0.91 0.01 245); --ink: oklch(0.2 0.02 250); --mute: oklch(0.45 0.02 250);
    --accent: oklch(0.5 0.17 248); --accent-ink: #fff; --ai: oklch(0.5 0.17 248); --ai-bg: oklch(0.95 0.03 245); --ok: oklch(0.6 0.14 155); --sun: oklch(0.9 0.16 98);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); color-scheme: light;
    font: 16px/1.55 "Schibsted Grotesk", system-ui, sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 12px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.ghost { border-color: transparent; background: transparent; }
  input, textarea { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 10px; outline: none; }
  input:focus, textarea:focus { border-color: var(--ink); }
  h1, h2, .brand { font-family: Caprasimo, Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  .muted { color: var(--mute); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700;
    color: #fff; flex: none; position: relative; }
  .avatar.on::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); border: 2px solid var(--panel); }
  .avatar.ai { background: var(--ai); }

  /* home */
  .home { max-width: 1120px; margin: 0 auto; padding: 22px 24px 80px; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; flex-wrap: wrap; }
  .top .brand { font-size: 26px; margin: 0; flex: 1; }
  .top .brand a { color: var(--accent); text-decoration: none; }
  .me { display: inline-flex; align-items: center; gap: 8px; border: none; background: transparent; padding: 4px 10px 4px 4px; border-radius: 999px; max-width: 60vw; }
  .me:hover { background: var(--panel); }
  @media (max-width: 520px) { .hello .primary { width: 100%; } .me span { max-width: 120px; } }
  .me span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .hello { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 36px; }
  .hello h1 { font-size: clamp(2rem, 4.2vw, 3rem); margin: 0; line-height: 1.05; }
  .helloText { flex: 1 1 320px; min-width: 0; }
  .hello p { margin: 10px 0 0; color: var(--mute); }
  .hello .primary { padding: 12px 18px; border-radius: 999px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 48px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; gap: 40px; } }
  .folder + .folder { margin-top: 40px; }
  .folder h2 { font-size: 22px; margin: 0 0 16px; display: flex; align-items: baseline; gap: 8px; }
  .folder h2 small { font: 600 13px "Schibsted Grotesk", sans-serif; color: var(--mute); }
  .cards { display: grid; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; text-decoration: none; color: inherit;
    display: flex; min-height: 112px; transition: transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s cubic-bezier(.22,1,.36,1); }
  .card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px -18px oklch(0.25 0.08 250 / .45); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .cover { flex: 0 0 120px; position: relative; display: flex; align-items: flex-end; padding: 14px 14px 14px 22px; color: #fff;
    background-image: radial-gradient(circle at 88% 12%, oklch(1 0 0 / .22), transparent 48%); box-shadow: inset 7px 0 0 oklch(0 0 0 / .14); }
  .cover span { font: 400 34px/1 Caprasimo, serif; letter-spacing: .02em; }
  @media (max-width: 560px) { .cover { flex-basis: 84px; padding-left: 18px; } .cover span { font-size: 26px; } }
  .card .info { padding: 16px 20px; min-width: 0; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card b { font-size: 18px; line-height: 1.3; }
  .card .sum { font-size: 14px; color: var(--mute); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 8px; font-size: 13px; color: var(--mute); }
  .stack { display: flex; padding-left: 4px; }
  .stack .avatar { width: 26px; height: 26px; font-size: 11px; margin-left: -6px; box-shadow: 0 0 0 2px var(--panel); }
  .friends { position: sticky; top: 24px; }
  .friends h2 { margin: 0 0 14px; font-size: 22px; display: flex; align-items: baseline; gap: 8px; }
  .friends h2 small { font: 600 13px "Schibsted Grotesk", sans-serif; color: var(--mute); }
  .friend { display: flex; align-items: center; gap: 12px; padding: 8px 10px; margin: 0 -10px; border-radius: 12px; }
  .friend:hover { background: var(--panel); }
  .friend .fn { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .friend small { display: block; color: var(--mute); font-size: 13px; font-weight: 400; }
  .friend .x { opacity: 0; }
  .friend:hover .x, .friend .x:focus-visible { opacity: 1; }
  @media (hover: none) { .friend .x { opacity: .6; } }
  .invite { margin-top: 14px; display: flex; gap: 8px; }
  .invite input { flex: 1; min-width: 0; }
  .row { display: flex; gap: 8px; }
  .row input, .row textarea { flex: 1; min-width: 0; }
  .nameAsk { display: grid; gap: 6px; background: var(--ai-bg); border-radius: 16px; padding: 18px 20px; margin-bottom: 28px; max-width: 520px; }
  .nameAsk .row { margin-top: 6px; }
  .empty { border: 1px dashed var(--line); border-radius: 14px; padding: 28px; text-align: center; color: var(--mute); }

  /* book */
  .book { display: grid; grid-template-columns: var(--side-w, 272px) minmax(0, 1fr) var(--doc-w, 380px); height: 100dvh; }
  .book.rail { --side-w: 68px; }
  .book > * { min-height: 0; }
  .book { overflow: hidden; }
  .book.nodoc { grid-template-columns: var(--side-w, 272px) 1fr; }
  .book.nodoc .doc { display: none; }
  .side { border-right: 1px solid var(--line); padding: 20px 16px; overflow: auto; display: flex; flex-direction: column; gap: 24px; background: var(--bg); }
  .side .title { font-family: Caprasimo, serif; font-size: 20px; border: none; background: transparent; padding: 2px 0; width: 100%; }
  .side .folderTag { font-size: 12px; color: var(--mute); }
  .sec h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); }
  .thread { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: none; background: transparent; padding: 9px 10px; border-radius: 10px; }
  .thread.sel { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
  .thread .n { margin-left: auto; font-size: 12px; color: var(--mute); flex: none; font-variant-numeric: tabular-nums; }
  .sec .thread + .thread, .sec .thread + .newRoom { margin-top: 2px; }
  /* Rows keep their hover/selected padding but their content lines up with the sidebar edge. */
  .side .sec .thread, .side .newRoom, .side .friendAdd { margin-left: -10px; margin-right: -10px; width: calc(100% + 20px); }
  .ri.book, .rb.geral { background: var(--accent); color: #fff; box-shadow: none; }
  .folderChip { font: 500 12px "Schibsted Grotesk", sans-serif; color: var(--mute); background: var(--bg); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  #roomName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ri { width: 26px; height: 26px; border-radius: 8px; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); }
  .rt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .newRoom { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; }
  .newRoom .ri { background: transparent; color: var(--mute); font-size: 16px; font-weight: 400; box-shadow: inset 0 0 0 1.5px var(--line); }
  .newRoom input { flex: 1; min-width: 0; border: none; background: transparent; padding: 4px 0; }
  .newRoom:focus-within { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
  .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 0 8px 4px; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .sug { background: var(--ai-bg); border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-bottom: 6px; }
  .sug b { display: block; }
  .sug .row { margin-top: 6px; }
  .sug button { padding: 3px 8px; font-size: 12px; }
  .friendAdd { display: flex; align-items: center; gap: 8px; border: none; background: transparent; padding: 4px 10px; margin-top: 2px; font-size: 13px; text-align: left; border-radius: 10px; color: var(--mute); }
  .friendAdd:hover { background: var(--panel); color: var(--ink); }
  .friendAdd .fn { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .friendAdd b { color: var(--accent); font-size: 16px; }
  .member .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .x { font-size: 18px; line-height: 1; padding: 2px 7px; color: var(--mute); flex: none; }
  .x:hover { color: oklch(0.5 0.2 25); background: oklch(0.95 0.03 25); }
  .friend .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .resend { font-size: 12px; padding: 2px 6px; color: var(--accent); flex: none; }
  .member { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; overflow: hidden; text-overflow: ellipsis; }

  .chat { display: flex; flex-direction: column; min-width: 0; background: var(--panel); }
  .chathead, .doc header { height: 64px; flex: none; padding: 0 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .chathead h2 { margin: 0; font-size: 18px; flex: 1; }
  .tasks { padding: 14px 28px; border-bottom: 1px solid var(--line); background: var(--bg); max-height: 40%; overflow: auto; }
  .task { display: flex; gap: 10px; align-items: center; padding: 3px 0; }
  .task .tt { flex: 1; cursor: text; border-radius: 6px; padding: 2px 4px; margin: -2px -4px; }
  .task .tt:hover { background: var(--panel); }
  .task .x { opacity: 0; }
  .task:hover .x, .task .x:focus-visible { opacity: 1; }
  .tedit { flex: 1; padding: 3px 6px; }
  .epicName { cursor: text; border-radius: 6px; }
  .epicName:hover { background: var(--bg); }
  #threadTitle { display: flex; align-items: center; gap: 6px; min-width: 0; }
  #threadTitle .x { font-size: 14px; opacity: .5; }
  #threadTitle .x:hover { opacity: 1; }
  .task.done span { text-decoration: line-through; color: var(--mute); }
  .msgs { flex: 1; overflow: auto; padding: 28px 28px 20px; display: flex; flex-direction: column; gap: 24px; }
  .msg { display: flex; gap: 14px; max-width: 720px; }
  .msg .body { min-width: 0; }
  .msg .who { font-size: 13px; color: var(--mute); margin-bottom: 3px; }
  .msg .txt { white-space: pre-wrap; word-wrap: break-word; }
  .msg.ai .txt { background: var(--ai-bg); padding: 14px 18px; border-radius: 4px 16px 16px 16px; white-space: normal; }
  .msg.ai .txt p { margin: 0 0 10px; } .msg.ai .txt p:last-child { margin: 0; }
  .msg.ai .txt ul { margin: 6px 0 10px; padding-left: 20px; } .msg.ai .txt li + li { margin-top: 4px; }
  .typing { color: var(--ai); font-size: 13px; overflow-wrap: anywhere; }
  .msg .txt a { color: var(--accent); overflow-wrap: anywhere; }
  .composer { border-top: 1px solid var(--line); padding: 16px 24px 20px; display: flex; flex-direction: column; gap: 6px; }
  .composer textarea { resize: none; min-height: 44px; max-height: 160px; }
  .modes { display: none; gap: 6px; align-items: center; font-size: 13px; }
  .modes.show { display: flex; }
  .modes button { padding: 3px 10px; border-radius: 999px; font-size: 12px; }
  .modes button.sel { background: var(--ai); color: #fff; border-color: var(--ai); }

  .doc { position: relative; border-left: 1px solid var(--line); display: flex; flex-direction: column; background: var(--bg); min-width: 0; }
  /* collapsible sidebar */
  .sideTop { display: flex; align-items: center; gap: 8px; }
  .sideTop a { flex: 1; font-size: 13px; text-decoration: none; }
  .iconBtn { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; border: none; background: transparent; border-radius: 10px; color: var(--mute); flex: none; }
  .iconBtn:hover { background: var(--panel); color: var(--ink); }
  .iconBtn svg { width: 20px; height: 20px; }
  .book.rail .side { padding: 14px 0; align-items: center; gap: 10px; }
  .railList { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .railSep { width: 28px; height: 1px; background: var(--line); margin: 4px 0; }
  .rb { position: relative; width: 40px; height: 40px; padding: 0; border-radius: 12px; border: none; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #fff; }
  .rb.geral { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font-size: 18px; }
  .rb.sel { outline: 2.5px solid var(--accent); outline-offset: 2px; }
  .rb .ring { position: absolute; inset: -5px; border-radius: 15px; background: conic-gradient(var(--ok) var(--p), transparent 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 0); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 0); pointer-events: none; }
  .rb.add { background: transparent; color: var(--mute); box-shadow: inset 0 0 0 1.5px var(--line); font-size: 20px; font-weight: 400; }
  .railPeople { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  @media (max-width: 900px) { .book.rail { --side-w: 1fr; } }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--panel); }
  .seg button { border: none; background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--mute); }
  .seg button.sel { background: var(--ink); color: var(--panel); }
  .preview { flex: 1; overflow: auto; padding: 24px 28px 40px; line-height: 1.6; overflow-wrap: anywhere; }
  .preview > :first-child { margin-top: 0; }
  .preview h1 { font-size: 26px; line-height: 1.15; margin: 0 0 16px; }
  .preview h2 { font: 700 18px/1.3 "Schibsted Grotesk", sans-serif; margin: 28px 0 8px; }
  .preview h3 { font: 700 16px/1.3 "Schibsted Grotesk", sans-serif; margin: 20px 0 6px; }
  .preview p { margin: 0 0 12px; }
  .preview .mmd { margin: 4px 0 16px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; text-align: center; }
  .preview .mmd svg { max-width: 100%; height: auto; }
  .preview .mmd.err { text-align: left; color: var(--mute); font-size: 13px; }
  .preview ul, .preview ol { margin: 0 0 12px; padding-left: 22px; }
  .preview li + li { margin-top: 4px; }
  .preview li > ul, .preview li > ol { margin: 4px 0 0; }
  .preview a { color: var(--accent); }
  .preview code { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-size: 13px; }
  .preview blockquote { margin: 0 0 12px; padding: 4px 14px; background: var(--panel); border-radius: 10px; color: var(--mute); }
  .preview table { border-collapse: collapse; margin: 0 0 12px; font-size: 14px; }
  .preview th, .preview td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .preview .empty { margin: 0; }
  .doc[data-view="preview"] textarea, .doc[data-view="edit"] .preview { display: none; }
  /* doc panel tabs + files library */
  .ptabs { display: flex; gap: 14px; flex: 1; align-items: baseline; min-width: 0; }
  .ptabs button { border: none; background: none; padding: 0; font: 400 17px/1 Caprasimo, serif; color: var(--mute); white-space: nowrap; }
  .ptabs button.sel { color: var(--ink); }
  .ptabs small { font: 600 12px "Schibsted Grotesk", sans-serif; color: var(--mute); margin-left: 4px; }
  .doc[data-pane="files"] .preview, .doc[data-pane="files"] textarea, .doc[data-pane="files"] .seg { display: none; }
  .doc[data-pane="doc"] .filesPane { display: none; }
  .filesPane { flex: 1; overflow: auto; padding: 20px 24px 40px; }
  .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
  .ftile { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; min-width: 0; }
  .ftile .thumb { aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; font-size: 30px; }
  .ftile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s cubic-bezier(.22,1,.36,1); }
  .ftile:hover img { transform: scale(1.04); }
  .ftile b { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ftile small { font-size: 12px; color: var(--mute); margin-top: -4px; }

  /* attachments */
  .tray { display: flex; gap: 10px; flex-wrap: wrap; }
  .tray:empty { display: none; }
  .pend { position: relative; width: 76px; height: 76px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; font-size: 11px; text-align: center; padding: 4px; }
  .pend img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .pend.up::after { content: ""; position: absolute; inset: 0; background: oklch(1 0 0 / .55); }
  .pend.up::before { content: ""; position: absolute; z-index: 1; width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  .pend.err { border-color: oklch(0.6 0.2 25); color: oklch(0.5 0.2 25); }
  .pend .rm { position: absolute; z-index: 2; top: 3px; right: 3px; width: 22px; height: 22px; padding: 0; border-radius: 50%; border: none; background: oklch(0.2 0.02 250 / .75); color: #fff; font-size: 14px; line-height: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .icon { padding: 6px 9px; font-size: 18px; line-height: 1; flex: none; align-self: center; }
  .chat.drop { box-shadow: inset 0 0 0 3px var(--accent); }
  .atts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .atts img { display: block; max-width: min(320px, 100%); max-height: 260px; border-radius: 12px; border: 1px solid var(--line); }
  .fileChip { display: inline-flex; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: inherit; background: var(--panel); }
  .fileChip small { color: var(--mute); }

  /* polls */
  .poll { margin-top: 6px; width: min(460px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: 0 8px 24px -16px oklch(0.3 0.08 250 / .5); }
  .pq { font-weight: 700; font-size: 17px; margin-bottom: 12px; }
  .opt { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 14px; margin-top: 8px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; transition: border-color .2s; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt .fill { position: absolute; inset: 0 auto 0 0; background: oklch(0.93 0.04 245); transition: width .5s cubic-bezier(.22,1,.36,1); z-index: 0; }
  .opt.mine { border-color: var(--accent); }
  .opt.mine .fill { background: oklch(0.88 0.07 245); }
  .opt.win .fill { background: oklch(0.92 0.12 98); }
  .opt > :not(.fill) { position: relative; z-index: 1; }
  .opt .ol { flex: 1; font-weight: 600; }
  .opt .pc { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 3ch; text-align: right; }
  .opt .stack .avatar { width: 20px; height: 20px; font-size: 9px; margin-right: -6px; border: 2px solid var(--panel); }
  .pf { margin-top: 12px; font-size: 13px; color: var(--mute); }
  .link { background: none; border: none; color: var(--accent); padding: 0; font-size: inherit; text-decoration: underline; }
  dialog { border: none; border-radius: 20px; padding: 24px; width: min(440px, calc(100% - 32px)); box-shadow: 0 30px 80px -20px oklch(0.2 0.08 250 / .5); }
  dialog::backdrop { background: oklch(0.2 0.05 250 / .35); }
  dialog h3 { margin: 0 0 14px; font: 400 22px Caprasimo, serif; }
  dialog form { display: grid; gap: 10px; }
  dialog .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  @media (prefers-reduced-motion: reduce) { .opt .fill, .ftile img { transition: none; } .pend.up::before { animation: none; } }
  .resizer { position: absolute; left: -5px; top: 0; bottom: 0; width: 9px; cursor: col-resize; z-index: 1; touch-action: none; }
  .resizer::after { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 1px; background: transparent; transition: background .15s; }
  .resizer:hover::after, .resizer:focus-visible::after, .resizer.drag::after { background: var(--accent); width: 2px; left: 3px; }
  .resizer:focus-visible { outline: none; }
  body.resizing { cursor: col-resize; user-select: none; }
  .doc header h2 { margin: 0; font-size: 18px; flex: 1; }
  .doc textarea { flex: 1; border: none; border-radius: 0; background: transparent; padding: 24px; resize: none; font: 14px/1.6 ui-monospace, Menlo, monospace; }

  .tabs { display: none; }
  @media (max-width: 900px) {
    .book, .book.nodoc { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .resizer { display: none; }
    /* iOS zooms into inputs under 16px and the page then pans sideways. */
    input, textarea, select { font-size: 16px !important; }
    .tabs { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--bg); }
    .tabs button.sel { background: var(--ink); color: var(--bg); }
    .book > .side, .book > .chat, .book > .doc { display: none; }
    .book[data-tab="side"] > .side, .book[data-tab="chat"] > .chat, .book[data-tab="doc"] > .doc { display: flex; }
  }
  /* login */
  .login { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: oklch(0.5 0.17 248); }
  .login .box { width: min(420px, 100%); background: var(--panel); border-radius: 22px; padding: 32px 28px; box-shadow: 0 30px 60px -25px oklch(0.15 0.1 250 / .6); }
  .login .brand { font-size: 26px; margin: 0 0 4px; color: var(--accent); text-decoration: none; display: inline-block; }
  .login h1 { font-size: 30px; margin: 10px 0 6px; line-height: 1.05; }
  .login p { margin: 0 0 20px; color: var(--mute); }
  .login form { display: grid; gap: 10px; }
  .login input { padding: 12px 14px; font-size: 16px; }
  .login .code { font-size: 28px; letter-spacing: .4em; text-align: center; font-weight: 700; }
  .login button { padding: 12px 16px; font-size: 16px; }
  .login .google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; }
  .login .or { display: flex; align-items: center; gap: 12px; color: var(--mute); font-size: 13px; margin: 18px 0; }
  .login .or::before, .login .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .login .err { color: oklch(0.5 0.2 25); font-size: 14px; min-height: 1.2em; margin: 4px 0 0; }
  .login .link { background: none; border: none; color: var(--accent); padding: 0; font-size: 14px; text-decoration: underline; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const $app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const COLORS = ["#ff5a36", "#1f9d8a", "#3b6cf6", "#c2410c", "#9333ea", "#0f766e", "#be185d", "#4d7c0f"];
const color = (s) => COLORS[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
let knownNames = {}; // email → display name (from /api/me friends + book state)
const name = (email) => email === "ai" ? "AI" : S?.names?.[email] || knownNames[email] || email.split("@")[0];
const avatar = (email, on) => email === "ai"
  ? `<span class="avatar ai">✦</span>`
  : `<span class="avatar ${on ? "on" : ""}" style="background:${color(email)}" title="${esc(name(email))}">${esc(name(email).slice(0, 2).toUpperCase())}</span>`;
const ago = (ts) => { const m = Math.round((Date.now() - ts) / 60000); return m < 1 ? "agora" : m < 60 ? `${m} min` : m < 1440 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d`; };
// Escaped text → clickable http(s) links (opened safely in a new tab).
const linkify = (h) => h.replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)"'\]]/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer nofollow ugc">${u}</a>`);
// Tiny markdown for AI messages: escape first, then bold/italics/lists/paragraphs.
const md = (s) => linkify(esc(s))
  .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\W)_(.+?)_(\W|$)/g, "$1<i>$2</i>$3")
  .split(/\n{2,}/).map((p) => /^\s*[-*] /m.test(p)
    ? `<ul>${p.split("\n").map((l) => l.replace(/^\s*[-*] /, "")).filter(Boolean).map((l) => `<li>${l}</li>`).join("")}</ul>`
    : `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
const api = async (path, body) => {
  const r = await fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { location.href = `/login?next=${encodeURIComponent(location.pathname)}`; throw new Error("unauthenticated"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
};

function route() {
  const m = location.pathname.match(/^\/b\/([a-z0-9]+)/);
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  if (location.pathname === "/login") return login();
  m ? openBook(m[1]) : home();
}

// ---------------- login ----------------
const GOOGLE_ICON = `<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>`;

async function login() {
  document.title = "Entrar · vibebook";
  const q = new URLSearchParams(location.search);
  const next = q.get("next") || "/app";
  const providers = await fetch("/auth/providers").then((r) => r.json()).catch(() => ({ google: false }));
  let email = "";
  const view = (step, err = "") => {
    $app.innerHTML = `
    <div class="login"><div class="box">
      <a class="brand" href="/">vibebook</a>
      ${step === "email" ? `
        <h1>Entrar</h1>
        <p>Seus vibebooks e seus amigos te esperando.</p>
        ${providers.google ? `<a class="google" href="/auth/google/start?next=${encodeURIComponent(next)}" style="text-decoration:none"><button type="button" class="google">${GOOGLE_ICON} Continuar com Google</button></a><div class="or">ou com email</div>` : ""}
        <form id="f"><label class="muted" for="email" style="font-size:14px">Seu email</label>
          <input id="email" type="email" autocomplete="email" required placeholder="voce@gmail.com" value="${esc(email)}" />
          <button class="primary" id="go">Mandar código</button>
          <p class="err" role="alert">${esc(err)}</p></form>` : `
        <h1>Confere seu email</h1>
        <p>Mandamos um código de 6 dígitos para <b>${esc(email)}</b>.</p>
        <form id="f"><label class="muted" for="code" style="font-size:14px">Código</label>
          <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required pattern="[0-9]{6}" />
          <button class="primary" id="go">Entrar</button>
          <p class="err" role="alert">${esc(err)}</p>
          <button type="button" class="link" id="back">usar outro email</button></form>`}
    </div></div>`;
    const f = document.getElementById("f");
    f.querySelector("input").focus();
    document.getElementById("back")?.addEventListener("click", () => view("email"));
    f.onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById("go"); btn.disabled = true; btn.textContent = "…";
      const path = step === "email" ? "/auth/email/start" : "/auth/email/verify";
      if (step === "email") email = document.getElementById("email").value.trim();
      const body = step === "email" ? { email } : { email, code: document.getElementById("code").value, next };
      const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) return view(step, j.error || "Algo deu errado. Tenta de novo.");
      if (step === "email") return view("code");
      location.href = j.next || "/app";
    };
    if (step === "code") document.getElementById("code").oninput = (e) => { if (e.target.value.replace(/\D/g, "").length === 6) f.requestSubmit(); };
  };
  view("email", q.get("error") === "google" ? "Não deu certo com o Google. Tenta com email." : "");
}
window.addEventListener("popstate", route);
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-nav]");
  if (a) { e.preventDefault(); history.pushState(null, "", a.getAttribute("href")); route(); }
});

// ---------------- home ----------------
async function home() {
  document.title = "vibebook";
  const me = await api("/api/me");
  knownNames = Object.fromEntries(me.friends.filter((f) => f.name).map((f) => [f.email, f.name]));
  const OTHER = "Outros";
  const byFolder = {};
  for (const b of me.books) (byFolder[b.folder || OTHER] ??= []).push(b);
  const folders = Object.keys(byFolder).sort((a, b) => (a === OTHER) - (b === OTHER) || a.localeCompare(b));
  const first = (me.name || "").split(" ")[0];
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  $app.innerHTML = `
  <div class="home">
    <header class="top">
      <div class="brand"><a href="/">vibebook</a></div>
      <button class="me" id="myName" title="Mudar seu nome">${avatar(me.email)}<span>${esc(me.name || me.email)}</span></button>
      <button class="ghost" id="logout">Sair</button>
    </header>
    ${me.name ? "" : `<form class="nameAsk" id="nameAsk"><b>Como seus amigos te chamam?</b><span class="muted">A AI e o pessoal vão te chamar assim.</span>
      <div class="row"><input name="n" required maxlength="60" placeholder="Seu nome" autocomplete="given-name" /><button class="primary">Salvar</button></div></form>`}
    <div class="hello">
      <div class="helloText"><h1>${first ? `Oi, ${esc(first)}` : "Seus vibebooks"}</h1>
        <p>${plural(me.books.length, "vibebook", "vibebooks")} · ${plural(me.friends.length, "amigo", "amigos")} · as pastas a AI organiza sozinha</p></div>
      <button class="primary" id="new">+ Novo vibebook</button>
    </div>
    <div class="grid">
      <main>
        ${me.books.length ? "" : `<div class="empty">Nenhum vibebook ainda. Crie um, chame os amigos e escreva <b>@ai</b> no chat.</div>`}
        ${folders.map((f) => `
          <section class="folder">
            <h2>${esc(f)} <small>${byFolder[f].length}</small></h2>
            <div class="cards">${byFolder[f].map((b) => { const people = (b.members || "").split(",").filter(Boolean); return `
              <a class="card" data-nav href="/b/${b.id}">
                <div class="cover" style="background-color:${coverColor(b.title)}"><span>${esc(initials(b.title))}</span></div>
                <div class="info">
                  <b>${esc(b.title)}</b>
                  <div class="sum">${esc(b.summary || "Ainda sem resumo. A AI escreve um quando a conversa andar.")}</div>
                  <div class="meta"><div class="stack">${people.slice(0, 5).map((e) => avatar(e)).join("")}</div><span>${ago(b.updated_at)}</span></div>
                </div>
              </a>`; }).join("")}
            </div>
          </section>`).join("")}
      </main>
      <aside class="friends">
        <h2>Amigos <small>${me.friends.length || ""}</small></h2>
        ${me.friends.length ? me.friends.map((f) => `
          <div class="friend">${avatar(f.email)}<div class="fn" title="${esc(f.email)}">${esc(f.name || name(f.email))}
            <small>${f.shared ? `${plural(f.shared, "vibebook junto", "vibebooks juntos")}` : f.joined ? "na plataforma" : "convidado"}</small></div>
            <button class="ghost x" data-unfriend="${esc(f.email)}" aria-label="Remover ${esc(f.email)} dos amigos" title="Remover dos amigos">×</button></div>`).join("")
          : `<p class="muted" style="font-size:14px">Quem você convida para um vibebook vira amigo aqui.</p>`}
        <form class="invite" id="addFriend"><input type="email" required placeholder="email do amigo" aria-label="Email do amigo" /><button>Convidar</button></form>
      </aside>
    </div>
  </div>`;
  const saveName = async (n) => { if (n?.trim()) { await api("/api/me", { name: n }); home(); } };
  document.getElementById("myName").onclick = () => saveName(prompt("Seu nome:", me.name || ""));
  document.getElementById("nameAsk")?.addEventListener("submit", (e) => { e.preventDefault(); saveName(e.target.n.value); });
  document.getElementById("logout").onclick = async () => { await fetch("/auth/logout", { method: "POST" }); location.href = "/"; };
  document.getElementById("new").onclick = async () => {
    const { id } = await api("/api/books", {});
    history.pushState(null, "", `/b/${id}`); route();
  };
  document.querySelectorAll("[data-unfriend]").forEach((b) => b.onclick = async () => {
    if (!confirm(`Remover ${b.dataset.unfriend} dos seus amigos? Os vibebooks em comum continuam.`)) return;
    await fetch(`/api/friends/${encodeURIComponent(b.dataset.unfriend)}`, { method: "DELETE" });
    home();
  });
  document.getElementById("addFriend").onsubmit = async (e) => {
    e.preventDefault();
    await api("/api/friends", { email: e.target[0].value }).catch((err) => alert(err.message));
    home();
  };
}

// ---------------- book ----------------
let ws = null;
let S = null; // book state
let thread = "main";
let mode = "fast";
let friends = []; // emails of people you already share something with
let attached = []; // composer attachments: { file, url, meta?, error? }
const FILE_TYPES = ["image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"];

function openBook(id) {
  thread = "main";
  S = null;
  attached = [];
  api("/api/me").then((me) => { friends = me.friends.map((f) => f.email); renderSide(); }).catch(() => {});
  $app.innerHTML = `<div class="home muted">Abrindo…</div>`;
  const connect = () => {
    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/${id}`);
    ws.onmessage = (e) => onEvent(JSON.parse(e.data), id);
    ws.onclose = (e) => { if (e.code === 4003) { $app.innerHTML = `<div class="home"><p>Você foi removido deste vibebook.</p><a data-nav href="/app">← seus vibebooks</a></div>`; ws = null; return; } if (S === null && e.code !== 1000) { $app.innerHTML = `<div class="home"><p>Sem acesso a este vibebook. Peça para alguém de dentro te convidar.</p><a data-nav href="/app">← voltar</a></div>`; return; } setTimeout(() => ws && connect(), 1000); };
  };
  connect();
}

const send = (m) => ws?.readyState === 1 && ws.send(JSON.stringify(m));

function onEvent(ev, id) {
  switch (ev.t) {
    case "state": {
      const firstLoad = !S;
      S = { ...ev, id, typing: {} };
      if (firstLoad) renderBook(); else { renderSide(); renderChat(); renderDoc(true); }
      return;
    }
    case "msg": S.messages.push(ev.m); if (ev.m.thread === thread) appendMsg(ev.m); renderSide(); return;
    case "delta": {
      const m = S.messages.find((x) => x.id === ev.id); if (m) m.text = ev.text;
      delete S.typing[ev.id];
      const el = document.getElementById(`m${ev.id}`); if (el) { const t = el.querySelector(".txt"); t.hidden = false; t.innerHTML = md(ev.text); }
      scrollDown(); return;
    }
    case "typing": { S.typing[ev.id] = ev.mode; const m = S.messages.find((x) => x.id === ev.id); const el = document.getElementById(`m${ev.id}`); if (el && !m?.text) el.querySelector(".txt").innerHTML = `<span class="typing">${ev.note ? esc(ev.note) : `pensando (${modeLabel[ev.mode]})`}…</span>`; return; }
    case "epics": S.epics = ev.epics; if (thread !== "main" && !S.epics.some((e) => e.id === thread)) thread = "main"; renderSide(); renderTasks(); return;
    case "doc": S.doc = ev.text; renderDoc(); return;
    case "meta":
      if (ev.title) S.book.title = ev.title;
      if (ev.folder) S.book.folder = ev.folder;
      if (ev.summary) S.book.summary = ev.summary;
      renderSide(); renderTasks(); return;
    case "suggestions": S.suggestions = ev.suggestions; renderSide(); return;
    case "members": S.members = ev.members; S.pending = ev.pending; S.names = ev.names || S.names; renderSide(); return;
    case "files": S.files = ev.files; renderFiles(); return;
    case "poll":
      S.polls = { ...S.polls, [ev.poll.id]: ev.poll };
      document.querySelectorAll(`.poll[data-poll="${ev.poll.id}"]`).forEach((el) => { el.outerHTML = pollHtml(ev.poll.id); });
      return;
    case "online": S.online = ev.online; renderSide(); return;
  }
}

const modeLabel = { fast: "⚡ rápido", medium: "◐ médio", heavy: "● pesado" };

function renderBook() {
  document.title = `${S.book?.title ?? "vibebook"} · vibebook`;
  $app.innerHTML = `
  <div class="book ${railMode ? "rail" : ""}" data-tab="chat">
    <nav class="tabs"><button data-tab="side">☰ Épicos</button><button data-tab="chat" class="sel">Chat</button><button data-tab="doc">Doc</button></nav>
    <aside class="side" id="side"></aside>
    <main class="chat">
      <div class="chathead"><h2 id="threadTitle"></h2><button class="ghost" id="toggleDoc" title="mostrar/ocultar documento">📄 Doc</button></div>
      <div class="tasks" id="tasks"></div>
      <div class="msgs" id="msgs"></div>
      <form class="composer" id="composer">
        <div class="modes" id="modes"><span class="muted">✦ AI:</span>
          ${Object.entries(modeLabel).map(([k, v]) => `<button type="button" data-mode="${k}" class="${k === mode ? "sel" : ""}">${v}</button>`).join("")}
        </div>
        <div class="tray" id="tray"></div>
        <div class="row">
          <button type="button" class="ghost icon" id="attach" title="Anexar imagem ou PDF (ou cole com Cmd+V)" aria-label="Anexar arquivo">📎</button>
          <button type="button" class="ghost icon" id="pollBtn" title="Criar votação" aria-label="Criar votação">📊</button>
          <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf" multiple hidden />
          <textarea id="input" rows="1" placeholder="Mensagem… @ai chama a AI"></textarea><button class="primary" id="sendBtn">Enviar</button>
        </div>
      </form>
    </main>
    <section class="doc">
      <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Redimensionar documento" tabindex="0"></div>
      <header><div class="ptabs" role="tablist"><button type="button" data-pane="doc">Documento</button><button type="button" data-pane="files">Arquivos<small id="fileCount"></small></button></div><div class="seg" role="group" aria-label="Modo do documento"><button type="button" data-view="preview">Ver</button><button type="button" data-view="edit">Editar</button></div></header>
      <div class="preview" id="preview"></div>
      <textarea id="doc" placeholder="O documento do vibebook. Todo mundo edita; a AI mantém atualizado com as decisões."></textarea>
      <div class="filesPane" id="filesPane"></div>
    </section>
  </div>
  <dialog id="pollDlg">
    <h3>Nova votação</h3>
    <form id="pollForm">
      <input name="q" required maxlength="300" placeholder="Pergunta (ex.: Qual cruzeiro?)" />
      <div id="pollOpts" style="display:grid;gap:8px"></div>
      <button type="button" class="link" id="addOpt" style="justify-self:start">+ opção</button>
      <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" name="multi" /> cada pessoa pode escolher várias</label>
      <div class="acts"><button type="button" id="pollCancel">Cancelar</button><button class="primary">Criar votação</button></div>
    </form>
  </dialog>`;
  const book = $app.querySelector(".book");
  $app.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
    book.dataset.tab = b.dataset.tab;
    $app.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("sel", x === b));
  });
  document.getElementById("toggleDoc").onclick = () => book.classList.toggle("nodoc");
  // Resizable doc panel; width remembered per browser.
  const setDocW = (w) => {
    w = Math.round(Math.min(Math.max(w, 260), window.innerWidth - 260 - 320));
    book.style.setProperty("--doc-w", `${w}px`);
    try { localStorage.setItem("vb.docW", w); } catch {}
  };
  try { const saved = Number(localStorage.getItem("vb.docW")); if (saved) setDocW(saved); } catch {}
  const resizer = document.getElementById("resizer");
  resizer.onpointerdown = (e) => {
    e.preventDefault();
    resizer.setPointerCapture(e.pointerId);
    resizer.classList.add("drag"); document.body.classList.add("resizing");
    resizer.onpointermove = (ev) => setDocW(window.innerWidth - ev.clientX);
    resizer.onpointerup = () => { resizer.onpointermove = null; resizer.classList.remove("drag"); document.body.classList.remove("resizing"); };
  };
  resizer.ondblclick = () => setDocW(380);
  resizer.onkeydown = (e) => {
    const cur = document.querySelector(".doc").getBoundingClientRect().width;
    if (e.key === "ArrowLeft") setDocW(cur + 24); else if (e.key === "ArrowRight") setDocW(cur - 24);
  };
  const input = document.getElementById("input");
  const modes = document.getElementById("modes");
  input.oninput = () => {
    modes.classList.toggle("show", /(^|\s)@ai\b/i.test(input.value) || /@a?i?$/i.test(input.value));
    input.style.height = "auto"; input.style.height = `${input.scrollHeight}px`;
  };
  input.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); document.getElementById("composer").requestSubmit(); } };
  modes.onclick = (e) => {
    const b = e.target.closest("[data-mode]"); if (!b) return;
    mode = b.dataset.mode; modes.querySelectorAll("[data-mode]").forEach((x) => x.classList.toggle("sel", x === b)); input.focus();
  };
  // Attachments: paste, drop or 📎. Upload right away; send once all are done.
  const tray = document.getElementById("tray");
  const sendBtn = document.getElementById("sendBtn");
  const renderTray = () => {
    tray.innerHTML = attached.map((p, i) => `<div class="pend ${!p.meta && !p.error ? "up" : ""} ${p.error ? "err" : ""}" title="${esc(p.error || p.file.name)}">
      ${p.url ? `<img src="${p.url}" alt="">` : `📄<br>${esc(p.file.name.slice(0, 18))}`}${p.error ? `<span style="position:relative;z-index:1">${esc(p.error)}</span>` : ""}
      <button type="button" class="rm" data-rm="${i}" aria-label="Remover anexo">×</button></div>`).join("");
    tray.querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => { const [p] = attached.splice(Number(b.dataset.rm), 1); if (p?.url) URL.revokeObjectURL(p.url); renderTray(); });
    const uploading = attached.some((p) => !p.meta && !p.error);
    sendBtn.disabled = uploading; sendBtn.textContent = uploading ? "Enviando…" : "Enviar";
  };
  const addFiles = (list) => {
    for (let file of list) {
      if (!FILE_TYPES.includes(file.type)) { alert(`${file.name}: só imagens (png, jpg, webp, gif) e PDF.`); continue; }
      if (file.size > 10 * 1024 * 1024) { alert(`${file.name}: maior que 10MB.`); continue; }
      if (!file.name || file.name === "image.png") file = new File([file], `print-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.png`, { type: file.type });
      const p = { file, url: file.type.startsWith("image/") ? URL.createObjectURL(file) : null };
      attached.push(p);
      fetch(`/api/books/${S.id}/files`, { method: "POST", headers: { "content-type": file.type, "x-filename": encodeURIComponent(file.name) }, body: file })
        .then(async (r) => { const j = await r.json().catch(() => ({})); if (r.ok) p.meta = j; else p.error = j.error || "falhou"; })
        .catch(() => { p.error = "sem conexão"; })
        .finally(renderTray);
    }
    renderTray();
  };
  const fileInput = document.getElementById("fileInput");
  document.getElementById("attach").onclick = () => fileInput.click();
  fileInput.onchange = () => { addFiles([...fileInput.files]); fileInput.value = ""; };
  input.addEventListener("paste", (e) => { const files = [...(e.clipboardData?.files ?? [])]; if (files.length) { e.preventDefault(); addFiles(files); } });
  const chatEl = $app.querySelector(".chat");
  chatEl.addEventListener("dragover", (e) => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); chatEl.classList.add("drop"); } });
  chatEl.addEventListener("dragleave", (e) => { if (!chatEl.contains(e.relatedTarget)) chatEl.classList.remove("drop"); });
  chatEl.addEventListener("drop", (e) => { e.preventDefault(); chatEl.classList.remove("drop"); addFiles([...e.dataTransfer.files]); });

  document.getElementById("composer").onsubmit = (e) => {
    e.preventDefault();
    if (attached.some((p) => !p.meta && !p.error)) return;
    const text = input.value.trim();
    const files = attached.filter((p) => p.meta).map((p) => p.meta.id);
    if (!text && !files.length) return;
    send({ t: "msg", thread, text, mode, files });
    attached.forEach((p) => p.url && URL.revokeObjectURL(p.url)); attached = [];
    input.value = ""; input.oninput(); renderTray();
  };

  // Polls: create via dialog, vote/close via delegation on the message list.
  const dlg = document.getElementById("pollDlg");
  const opts = document.getElementById("pollOpts");
  const addOpt = (v = "") => { opts.insertAdjacentHTML("beforeend", `<input name="opt" maxlength="200" placeholder="Opção ${opts.children.length + 1}" value="${esc(v)}" />`); };
  document.getElementById("pollBtn").onclick = () => { document.getElementById("pollForm").reset(); opts.innerHTML = ""; addOpt(); addOpt(); addOpt(); dlg.showModal(); };
  document.getElementById("addOpt").onclick = () => { if (opts.children.length < 10) addOpt(); opts.lastElementChild.focus(); };
  document.getElementById("pollCancel").onclick = () => dlg.close();
  document.getElementById("pollForm").onsubmit = (e) => {
    e.preventDefault();
    const f = e.target;
    const options = [...f.querySelectorAll('[name="opt"]')].map((i) => i.value.trim()).filter(Boolean);
    if (options.length < 2) return alert("Coloque pelo menos 2 opções.");
    send({ t: "poll.create", thread, question: f.q.value, options, multi: f.multi.checked });
    dlg.close();
  };
  document.getElementById("msgs").addEventListener("click", (e) => {
    const v = e.target.closest("[data-vote]");
    if (v) return send({ t: "vote", id: v.closest("[data-poll]").dataset.poll, opt: Number(v.dataset.vote) });
    const c = e.target.closest("[data-close]");
    if (c && confirm("Encerrar a votação?")) send({ t: "poll.close", id: c.dataset.close });
  });

  // Right panel: Documento / Arquivos
  const setPane = (pane) => {
    $app.querySelector(".doc").dataset.pane = pane;
    $app.querySelectorAll(".ptabs button").forEach((b) => { b.classList.toggle("sel", b.dataset.pane === pane); b.setAttribute("aria-selected", b.dataset.pane === pane); });
    if (pane === "files") renderFiles();
  };
  $app.querySelectorAll(".ptabs button").forEach((b) => b.onclick = () => setPane(b.dataset.pane));
  setPane("doc");
  const doc = document.getElementById("doc");
  let timer;
  doc.oninput = () => { clearTimeout(timer); timer = setTimeout(() => { S.doc = doc.value; send({ t: "doc", text: doc.value }); }, 400); };
  doc.onblur = () => renderDoc();
  const docPanel = $app.querySelector(".doc");
  const setView = (v) => {
    docPanel.dataset.view = v;
    docPanel.querySelectorAll(".seg button").forEach((b) => b.classList.toggle("sel", b.dataset.view === v));
    try { localStorage.setItem("vb.docView", v); } catch {}
    if (v === "edit") doc.focus(); else renderDoc();
  };
  docPanel.querySelectorAll(".seg button").forEach((b) => b.onclick = () => setView(b.dataset.view));
  let savedView = "preview"; try { savedView = localStorage.getItem("vb.docView") || "preview"; } catch {}
  docPanel.dataset.view = savedView;
  docPanel.querySelectorAll(".seg button").forEach((b) => b.classList.toggle("sel", b.dataset.view === savedView));
  renderSide(); renderChat(); renderDoc(true); renderFiles();
}

const bookTitle = () => S?.book?.title || "vibebook";
const COVERS = ["oklch(0.5 0.17 248)", "oklch(0.58 0.17 35)", "oklch(0.52 0.11 175)", "oklch(0.47 0.15 315)", "oklch(0.6 0.13 75)", "oklch(0.45 0.1 145)", "oklch(0.36 0.06 255)", "oklch(0.55 0.16 10)"];
const coverColor = (t) => COVERS[[...String(t)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % COVERS.length];
const STOP = new Set(["e", "de", "do", "da", "dos", "das", "o", "a", "os", "as", "em", "no", "na", "para", "pra", "com", "por", "the", "and", "of"]);
const initials = (t) => {
  const words = t.replace(/[^\p{L}\p{N} ]/gu, " ").trim().split(/\s+/).filter(Boolean);
  const main = words.filter((w) => !STOP.has(w.toLowerCase()));
  return ((main.length ? main : words).slice(0, 2).map((w) => w[0]).join("") || "◆").toUpperCase();
};

function renderTasks() {
  const el = document.getElementById("tasks"); if (!el) return;
  const epic = S.epics.find((e) => e.id === thread);
  const head = document.getElementById("threadTitle");
  head.innerHTML = epic
    ? `<span class="epicName" id="roomName" title="Clique para renomear">${esc(epic.title)}</span><button class="ghost x" id="epicDel" title="Apagar épico" aria-label="Apagar épico">🗑</button>`
    : `<span class="epicName" id="roomName" title="${esc(S.book?.summary || "Clique para renomear")}">${esc(bookTitle())}</span>${S.book?.folder ? `<small class="folderChip">📁 ${esc(S.book.folder)}</small>` : ""}`;
  document.getElementById("roomName").onclick = () => {
    const cur = epic ? epic.title : bookTitle();
    const t = prompt(epic ? "Nome do épico:" : "Nome do vibebook:", cur);
    if (!t?.trim() || t === cur) return;
    send(epic ? { t: "epic.rename", id: epic.id, title: t } : { t: "title", title: t });
  };
  el.style.display = epic ? "" : "none";
  if (!epic) return;
  document.getElementById("epicDel").onclick = () => { if (confirm(`Apagar o épico "${epic.title}", as tasks e a discussão dele? Não dá pra desfazer.`)) send({ t: "epic.del", id: epic.id }); };
  el.innerHTML = `${epic.tasks.map((t) => `<div class="task ${t.done ? "done" : ""}" data-task="${t.id}">
      <input type="checkbox" ${t.done ? "checked" : ""} aria-label="Feita" /><span class="tt" title="Clique para editar">${esc(t.title)}</span>
      <button class="ghost x" data-tdel="${t.id}" aria-label="Apagar task" title="Apagar task">×</button></div>`).join("")}
    <form class="row" id="newTask" style="margin-top:6px"><input placeholder="nova task" /><button>+</button></form>`;
  el.querySelectorAll("[data-task] input[type=checkbox]").forEach((c) => c.onchange = () => send({ t: "task.toggle", id: c.closest("[data-task]").dataset.task }));
  el.querySelectorAll("[data-task] .tt").forEach((sp) => sp.onclick = () => {
    const id = sp.closest("[data-task]").dataset.task;
    const inp = document.createElement("input"); inp.value = sp.textContent; inp.className = "tedit";
    sp.replaceWith(inp); inp.focus(); inp.select();
    const done = (save) => { if (save && inp.value.trim() && inp.value !== sp.textContent) send({ t: "task.rename", id, title: inp.value }); else inp.replaceWith(sp); };
    inp.onkeydown = (e) => { if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); };
    inp.onblur = () => done(true);
  });
  el.querySelectorAll("[data-tdel]").forEach((b) => b.onclick = () => send({ t: "task.del", id: b.dataset.tdel }));
  document.getElementById("newTask").onsubmit = (e) => { e.preventDefault(); send({ t: "task.add", epic: thread, title: e.target[0].value }); e.target.reset(); };
}

const fileUrl = (f) => `/api/books/${S.id}/files/${f.id}`;
const kb = (n) => n > 1e6 ? `${(n / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1e3))} KB`;
const attHtml = (files) => files?.length ? `<div class="atts">${files.map((f) => f.type.startsWith("image/")
  ? `<a href="${fileUrl(f)}" target="_blank" rel="noopener"><img src="${fileUrl(f)}" alt="${esc(f.name)}" loading="lazy" /></a>`
  : `<a class="fileChip" href="${fileUrl(f)}" target="_blank" rel="noopener">📄 ${esc(f.name)} <small>${kb(f.size)}</small></a>`).join("")}</div>` : "";

function pollHtml(id) {
  const p = S.polls?.[id]; if (!p) return "";
  const counts = p.votes.map((v) => v.length);
  const sum = counts.reduce((a, b) => a + b, 0);
  const max = Math.max(...counts);
  const voters = new Set(p.votes.flat()).size;
  return `<div class="poll" data-poll="${id}">
    <div class="pq">📊 ${esc(p.question)}</div>
    ${p.options.map((o, i) => {
      const n = counts[i], pct = sum ? Math.round((100 * n) / sum) : 0, mine = p.votes[i].includes(S.me), win = p.closed && n > 0 && n === max;
      return `<button type="button" class="opt ${mine ? "mine" : ""} ${win ? "win" : ""}" data-vote="${i}" ${p.closed ? "disabled" : ""} aria-pressed="${mine}">
        <span class="fill" style="width:${pct}%"></span><span class="ol">${win ? "🏆 " : mine ? "✓ " : ""}${esc(o)}</span>
        <span class="stack">${p.votes[i].slice(0, 4).map((e) => avatar(e)).join("")}</span><span class="pc">${n ? `${pct}%` : ""}</span></button>`;
    }).join("")}
    <div class="pf">${voters} ${voters === 1 ? "pessoa votou" : "pessoas votaram"} · ${p.multi ? "pode escolher várias" : "escolha uma"}${p.closed ? " · encerrada" : p.author === S.me || p.author === "ai" ? ` · <button type="button" class="link" data-close="${id}">encerrar</button>` : ""}</div>
  </div>`;
}

const msgHtml = (m) => {
  const txt = m.author === "ai" ? (m.text ? md(m.text) : m.poll ? "" : `<span class="typing">pensando…</span>`) : m.text ? linkify(esc(m.text)) : "";
  return `
  <div class="msg ${m.author === "ai" ? "ai" : ""}" id="m${m.id}">
    ${avatar(m.author)}
    <div class="body"><div class="who">${esc(name(m.author))} · ${ago(m.ts)}</div>
      ${txt ? `<div class="txt">${txt}</div>` : `<div class="txt" hidden></div>`}${attHtml(m.files)}${m.poll ? pollHtml(m.poll) : ""}</div>
  </div>`;
};

function renderChat() {

function appendMsg(m) {
  const el = document.getElementById("msgs");
  el.querySelector(".empty")?.remove();
  el.insertAdjacentHTML("beforeend", msgHtml(m));
  scrollDown(true); pinOnLoad(el.lastElementChild);

// Images change height after they load; keep pinned to the bottom when we were there.
let stick = true; // was the reader at the bottom of the chat?
// Messages grow after render (images, fonts, polls); stay pinned to the bottom if the reader was there.
const pinRO = new ResizeObserver(() => { const el = document.getElementById("msgs"); if (el && stick) el.scrollTop = el.scrollHeight; });
function pinOnLoad(root) {
  if (!root) return;
  (root.classList?.contains("msg") ? [root] : root.querySelectorAll(".msg")).forEach((m) => pinRO.observe(m));

function scrollDown(force) {
