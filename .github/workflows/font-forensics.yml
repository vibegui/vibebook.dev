name: Diagnostic Studio font forensics

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: font-forensics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rejected-font-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-font-forensics' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FONT_FORENSICS_OUTPUT: ${{ github.workspace }}/.artifacts/font-forensics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Compare original aliases, exact roundtrip and rejected diagnostic subset
        run: bun scripts/font-forensics-browser.ts
      - name: Preserve synthetic raster evidence even on control failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: font-forensics-${{ github.sha }}
          path: ${{ github.workspace }}/.artifacts/font-forensics/
          if-no-files-found: error
          retention-days: 14
