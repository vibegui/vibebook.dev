name: Frontend chunk module diagnostics

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunk-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  module-attribution:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-chunk-diagnostics' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VIBEBOOK_CHUNK_DIAGNOSTICS: "1"
      TEST_APP_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test scripts/ui-chunk-diagnostics.test.ts
      - run: bun run build:vanilla-ui && bun run build:ui
      - name: Explain static bootstrap closure without pretending dynamic startup was observed
        run: |
          bun scripts/ui-chunk-attribution.ts .artifacts/chunk-diagnostics/vanilla.json
          bun scripts/ui-chunk-attribution.ts .artifacts/chunk-diagnostics/svelte.json
      - name: Preserve module/chunk graph and exact emitted asset hashes
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chunk-diagnostics-${{ github.sha }}
          path: ${{ github.workspace }}/.artifacts/chunk-diagnostics/
          if-no-files-found: error
          retention-days: 14
