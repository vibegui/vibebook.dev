name: App document transport security
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-document-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-event:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEST_REVISION: ${{ github.sha }}
      TEST_OUTPUT: ${{ github.workspace }}/.artifacts/app-document
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: bun run test:app-document:browser
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-document-${{ github.sha }}
          path: |
            .artifacts/app-document/results.json
            .artifacts/app-document/adversarial/results.json
          if-no-files-found: warn
          retention-days: 7
