name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build the complete opt-in preview
        id: preview
        run: bun run build:ui
      - name: Run every repository gate
        run: bun scripts/check-ci.ts
      - name: Verify checked-in preview artifacts
        if: ${{ always() && steps.preview.outcome == 'success' }}
        run: git diff --exit-code -- public/app-svelte.html public/svelte-preview/ public/sw.js
      - name: Retain preview assets for browser verification
        if: ${{ always() && steps.preview.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: svelte-preview-${{ matrix.os }}-${{ github.sha }}
          path: |
            public/app-svelte.html
            public/svelte-preview/
            public/sw.js
          if-no-files-found: error
          retention-days: 7

  room-layout-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      TEST_PUBLIC_ROOT: ${{ github.workspace }}/public
      TEST_APP_REVISION: ${{ github.sha }}
      TEST_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/room-layout-browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: bun run build:ui
      - name: Verify the production layout in Chromium
        run: bun run test:room-layout:browser
      - name: Retain browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: room-layout-browser-${{ github.sha }}
          path: ${{ github.workspace }}/.artifacts/room-layout-browser/
          if-no-files-found: warn
          retention-days: 7
